<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omda Hero</title>
<script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
      />
    <style>
      *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      }
      .card{
    backdrop-filter:blur(30px);
   background:rgba(88,100,190,.08);
border:1px solid rgba(115,128,223,.18);
box-shadow:
0 0 40px rgba(88,100,190,.15),
inset 0 1px 0 rgba(255,255,255,.05);
}
      .swiper{
      width:100%;
      height:100vh;
      }
      .swiper-slide{
      position:relative;
      overflow:hidden;
      }
      /*==========================
      IMAGEM
      ===========================*/
      .hero-image{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1);
      transition:transform 10s linear;
      }
      .swiper-slide-active .hero-image{
      transform:scale(1.08);
      }
      /*==========================
      LUZ
      ===========================*/
      .hero-light{
      position:absolute;
      inset:0;
      background:
      radial-gradient(
      circle at 75% 30%,
      rgba(255,255,255,.15),
      transparent 40%
      );
      mix-blend-mode:screen;
      z-index:2;
      }
      /*==========================
      TOPO
      ===========================*/
      .hero-overlay-top{
      position:absolute;
      inset:0;
      background:
      linear-gradient(
      to bottom,
      rgba(0,0,0,.45),
      transparent 25%
      );
      z-index:3;
      }
      /*==========================
      LATERAIS
      ===========================*/
      .hero-overlay-side{
      position:absolute;
      inset:0;
      background:
      linear-gradient(
      90deg,
      rgba(0,0,0,.45),
      rgba(0,0,0,.15) 20%,
      transparent 45%,
      transparent 65%,
      rgba(0,0,0,.20)
      );
      z-index:3;
      }
      /*==========================
      FUNDO
      ===========================*/
      .hero-overlay-bottom{
      position:absolute;
      inset:0;
      background:
      linear-gradient(
      to top,
      rgba(9,9,11,1),
      rgba(9,9,11,.88) 12%,
      rgba(9,9,11,.55) 22%,
      rgba(9,9,11,.15) 35%,
      transparent 55%
      );
      z-index:4;
      }
      /*==========================
      CONTEÚDO
      ===========================*/
      .hero-content{
      position:absolute;
      left:7%;
      bottom:8%;
      width:650px;
      max-width:90%;
      color:white;
      z-index:20;
      }
      .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:50px;
      background:#5864be;
      margin-bottom:20px;
      font-size:13px;
      font-weight:700;
      }
      .hero-title{
      font-size:76px;
      font-weight:900;
      line-height:.9;
      text-shadow:
      0 10px 30px rgba(0,0,0,.7);
      }
      .hero-meta{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:20px;
      }
      .hero-meta span{
      padding:8px 14px;
      background:rgba(255,255,255,.08);
      border-radius:30px;
      font-size:14px;
      }
      .hero-description{
      margin-top:25px;
      font-size:19px;
      line-height:1.7;
      color:#ececec;
      text-shadow:
      0 5px 20px rgba(0,0,0,.8);
      }
      .buttons{
      display:flex;
      gap:15px;
      margin-top:35px;
      }
      .btn{
      padding:16px 30px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      font-size:15px;
      font-weight:700;
      transition:.35s;
      }
      .primary{
      background:#5864be;
      color:white;
      }
      .primary:hover{
      transform:translateY(-4px);
      }
      .secondary{
      background:rgba(255,255,255,.12);
      color:white;
      }
      .secondary:hover{
      background:rgba(255,255,255,.18);
      }
      @media(max-width:900px){
      .hero-content{
      left:30px;
      right:30px;
      bottom:35px;
      width:auto;
      }
      .hero-title{
      font-size:44px;
      }
      .hero-description{
      font-size:16px;
      }
      }
      .hero-timeline{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:4px;
      background:rgba(255,255,255,.15);
      z-index:50;
      overflow:hidden;
      }
      .timeline-progress{
      width:0%;
      height:100%;
      background:#5864be;
      }
    </style>
  </head>
  <body>
    <div id="loadingBar"></div>
	<style>

		  #loadingBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 4px;
            z-index: 99999;
            opacity: 1;
            transition: width .25s linear, opacity .3s ease;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #818cf8,
                #a78bfa
            );

            box-shadow: 0 0 12px rgba(96, 165, 250, .5);
        }

      
		@media(max-width:1200px){
		nav.md\:flex.ml-8.items-center.gap-6.text-2xl.text-white {
    display: none !important;
}
}
	</style>
    <div class="swiper heroSwiper">
      <div class="swiper-wrapper">
             <!-- Slide 0 -->
        <div class="swiper-slide">
          <img
            class="hero-image"
            src="../assets/images/naruto.webp"
            alt="">
          <div class="hero-light"></div>
          <div class="hero-overlay-top"></div>
          <div class="hero-overlay-side"></div>
          <div class="hero-overlay-bottom"></div>
       <div class="hero-content">
<div class="card w-full max-w-md rounded-3xl p-6 sm:p-8 relative">
 
<form id="loginForm" class="space-y-6">

    <div id="stepEmail">

        <div class="relative">

            <input
                id="email"
                type="email"
                placeholder=" "
                class="peer w-full h-14 rounded-2xl bg-white/5 border border-white/10 px-5 text-white outline-none focus:border-[#7380df] focus:ring-2 focus:ring-[#5864be]/20"
            >

            <label
                for="email"
                class="absolute left-5 top-4 text-zinc-400 transition-all duration-300 peer-focus:text-xs peer-focus:top-2 peer-focus:text-[#7380df] peer-[&:not(:placeholder-shown)]:text-xs peer-[&:not(:placeholder-shown)]:top-2"
            >
                Email
            </label>

            <button
                type="button"
                id="nextBtn"
                class="absolute right-2 top-2 w-10 h-10 rounded-full text-white flex items-center justify-center transition hover:scale-105"
                style="background:linear-gradient(135deg,#7380df,#5864be)"
            >
                →
            </button>

        </div>

        <p id="emailStatus" class="text-xs text-zinc-400 pl-2"></p>

    </div>

    <div id="stepPassword" class="hidden">

        <div class="relative">

            <input
                id="password"
                type="password"
                placeholder=" "
                class="peer w-full h-14 rounded-2xl bg-white/5 border border-white/10 px-5 text-white outline-none focus:border-[#7380df] focus:ring-2 focus:ring-[#5864be]/20"
            >

            <label
                for="password"
                class="absolute left-5 top-4 text-zinc-400 transition-all duration-300 peer-focus:text-xs peer-focus:top-2 peer-focus:text-[#7380df] peer-[&:not(:placeholder-shown)]:text-xs peer-[&:not(:placeholder-shown)]:top-2"
            >
                Senha
            </label>

        </div>

        <button
        id="loginBtn"
            type="submit"
            class="w-full h-12 rounded-2xl text-white mt-4"
            style="background:linear-gradient(135deg,#7380df,#5864be)"
        >
            Entrar
        </button>

       
        <button
            type="button"
            class="w-full h-12 rounded-2xl bg-white/5 border border-white/10 text-white mt-3"
        >
            Continuar com Google
        </button>

        <button
            type="button"
            class="w-full text-zinc-400 text-sm mt-3"
        >
            Não lembro minha senha
        </button>

    </div>

</form>

<div class="text-center text-[11px] text-zinc-500 mt-8">
    OMDA Tracker • v1.0.0
</div>
 

</div>
       </div>
        </div>
       
     
      </div>
      <div class="hero-timeline">
        <div class="timeline-progress"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const swiper = new Swiper(".heroSwiper", {
      
          loop: true,
      
          effect: "fade",
      
          fadeEffect: {
              crossFade: true
          },
      
          speed: 2500,
      
          autoplay: {
              delay: 7000,
              disableOnInteraction: false
          },
      
          allowTouchMove: false,
      
          keyboard: {
              enabled: true
          }
      
      });
      const progress = document.querySelector(".timeline-progress");
      
      function startTimeline(){
      
          progress.style.transition = "none";
          progress.style.width = "0%";
      
          requestAnimationFrame(()=>{
      
              progress.style.transition = "width 7000ms linear";
              progress.style.width = "100%";
      
          });
      
      }
      
      startTimeline();
      
      swiper.on("slideChangeTransitionStart", ()=>{
      
          startTimeline();
      
      });
    </script>
  
<script>

const email = document.getElementById('email');
const status = document.getElementById('emailStatus');

email.addEventListener('input',()=>{

    const valid =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);

    if(email.value.length === 0){
        status.textContent='';
        return;
    }

    status.textContent =
    valid ? '✓ válido' : 'email inválido';

});

document
.getElementById('nextBtn')
.addEventListener('click',()=>{

    const valid =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);

    if(!valid){
        email.focus();
        return;
    }

    document
    .getElementById('stepEmail')
    .classList.add('hidden');

    document
    .getElementById('stepPassword')
    .classList.remove('hidden');

});

</script>
  <script>
        const loadingBar = document.getElementById("loadingBar");

        let progress = 0;
        let loadingInterval;

        function startLoading() {

            progress = 0;

            loadingBar.style.opacity = "1";
            loadingBar.style.width = "0%";

            loadingInterval = setInterval(() => {

                if (progress < 90) {

                    progress += Math.random() * 8;

                    loadingBar.style.width = progress + "%";

                }

            }, 100);

        }

        function finishLoading() {

            clearInterval(loadingInterval);

            loadingBar.style.width = "100%";

            setTimeout(() => {

                loadingBar.style.opacity = "0";

                setTimeout(() => {

                    loadingBar.style.width = "0%";
                    loadingBar.style.opacity = "1";

                }, 300);

            }, 250);

        }

        function simularLogin() {

            startLoading();

            // Simula uma requisição de 3 segundos
            setTimeout(() => {

                finishLoading();

                console.log("Login realizado!");

            }, 3000);

        }
    </script>
