
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Rotina</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white text-gray-900 antialiased">
  <main class="max-w-2xl mx-auto px-4 py-6 pb-24">

    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Minha rotina</h1>
        <p class="text-sm text-gray-500 mt-1">Organize seu dia.</p>
      </div>
      <button id="nova" aria-label="Nova atividade"
        class="bg-gray-900 text-white rounded-xl p-3 hover:bg-gray-700">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </button>
    </header>

    <nav id="dias" class="grid grid-cols-7 gap-1 mb-6" aria-label="Dias da semana"></nav>

    <div id="status" class="text-sm text-gray-500 mb-4" role="status">
      Carregando rotina...
    </div>

    <section id="agenda" class="space-y-6"></section>

    <form id="form" class="hidden border rounded-2xl p-4 mt-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="tituloForm" class="font-semibold">Nova atividade</h2>
        <button type="button" id="fechar" aria-label="Fechar formulário"
          class="p-1 text-gray-500">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <input id="atividadeId" type="hidden">

      <div>
        <label for="nome" class="block text-sm mb-1">Atividade</label>
        <input id="nome" required maxlength="150"
          placeholder="Ex.: Estudar programação"
          class="w-full border rounded-xl px-3 py-3 outline-none focus:ring-2 focus:ring-gray-300">
      </div>

      <div>
        <label for="dia" class="block text-sm mb-1">Dia da semana</label>
        <select id="dia" required
          class="w-full border rounded-xl px-3 py-3 bg-white">
          <option value="1">Segunda-feira</option>
          <option value="2">Terça-feira</option>
          <option value="3">Quarta-feira</option>
          <option value="4">Quinta-feira</option>
          <option value="5">Sexta-feira</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="inicio" class="block text-sm mb-1">Início</label>
          <input id="inicio" type="time" required
            class="w-full border rounded-xl px-3 py-3">
        </div>
        <div>
          <label for="fim" class="block text-sm mb-1">Fim</label>
          <input id="fim" type="time" required
            class="w-full border rounded-xl px-3 py-3">
        </div>
      </div>

      <div>
        <label for="tipo" class="block text-sm mb-1">Tipo</label>
        <select id="tipo" required
          class="w-full border rounded-xl px-3 py-3 bg-white">
          <option value="trabalho_fisico">Trabalho físico</option>
          <option value="lazer">Lazer</option>
        </select>
      </div>

      <div class="flex gap-2">
        <button id="salvar" type="submit"
          class="flex-1 bg-gray-900 text-white rounded-xl px-4 py-3 font-medium">
          Salvar atividade
        </button>
        <button id="cancelar" type="button"
          class="border rounded-xl px-4 py-3">Cancelar</button>
      </div>
    </form>

    <footer class="mt-8 text-xs text-gray-400 text-center">
      Rotina semanal
    </footer>
  </main>

  <button id="novaFixa"
    class="fixed bottom-5 left-4 right-4 max-w-2xl mx-auto bg-gray-900 text-white rounded-xl py-3.5 flex items-center justify-center gap-2 shadow-lg"
    aria-label="Adicionar atividade">
    <i data-lucide="plus" class="w-5 h-5"></i>
    Nova atividade
  </button>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore, collection, addDoc, getDocs,
      doc, updateDoc, deleteDoc, serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // SUBSTITUA PELAS CREDENCIAIS DO SEU PROJETO FIREBASE
     const firebaseConfig = {
        apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
        authDomain: "myops-d7525.firebaseapp.com",
        projectId: "myops-d7525",
        storageBucket: "myops-d7525.firebasestorage.app",
        messagingSenderId: "247824192162",
        appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
        };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tabela = collection(db, "atividades");
    const $ = id => document.getElementById(id);

    const dias = [
      { id: 1, nome: "Segunda", curto: "SEG" },
      { id: 2, nome: "Terça", curto: "TER" },
      { id: 3, nome: "Quarta", curto: "QUA" },
      { id: 4, nome: "Quinta", curto: "QUI" },
      { id: 5, nome: "Sexta", curto: "SEX" },
      { id: 6, nome: "Sábado", curto: "SÁB" },
      { id: 0, nome: "Domingo", curto: "DOM" }
    ];

    const periodos = [
      { nome: "Manhã", icone: "sun" },
      { nome: "Tarde", icone: "sunset" },
      { nome: "Noite", icone: "moon" }
    ];

    let diaSelecionado = new Date().getDay();
    let atividades = [];
    let ocupado = false;

    function icone(nome, classe = "w-4 h-4") {
      const i = document.createElement("i");
      i.setAttribute("data-lucide", nome);
      i.className = classe;
      return i;
    }

    function el(tag, classe = "", texto = "") {
      const node = document.createElement(tag);
      node.className = classe;
      node.textContent = texto;
      return node;
    }

    function atualizarIcones() {
      if (window.lucide) window.lucide.createIcons();
    }

    function periodoDaAtividade(hora) {
      if (hora < "12:00" && hora >= "05:00") return "Manhã";
      if (hora >= "12:00" && hora < "18:00") return "Tarde";
      return "Noite";
    }

    function mostrarDias() {
      const nav = $("dias");
      nav.replaceChildren();

      dias.forEach(dia => {
        const ativo = dia.id === diaSelecionado;
        const botao = el(
          "button",
          `rounded-xl py-3 flex flex-col items-center gap-1 ${
            ativo ? "bg-gray-900 text-white" : "bg-gray-50 text-gray-600"
          }`
        );

        botao.type = "button";
        botao.setAttribute("aria-pressed", String(ativo));
        botao.setAttribute("aria-label", dia.nome);
        botao.append(
          el("span", "text-xs font-semibold", dia.curto),
          el("span", "text-xs", String(dia.id))
        );

        // O número é apenas decorativo: o dia da semana é identificado pelo rótulo.
        botao.lastChild.textContent = dia.id === 0 ? "7" : String(dia.id);
        botao.lastChild.className = "text-xs opacity-70";

        botao.onclick = () => {
          diaSelecionado = dia.id;
          mostrarDias();
          mostrarAgenda();
        };

        nav.append(botao);
      });
    }

    function mostrarAgenda() {
      const agenda = $("agenda");
      agenda.replaceChildren();

      const dia = dias.find(d => d.id === diaSelecionado);
      agenda.append(el("h2", "text-lg font-semibold", dia.nome));

      const doDia = atividades
        .filter(a => Number(a.dia) === diaSelecionado)
        .sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""));

      periodos.forEach(periodo => {
        const secao = el("section", "space-y-3");
        const cabecalho = el(
          "div",
          "flex items-center gap-2 text-gray-500"
        );

        cabecalho.append(
          icone(periodo.icone, "w-5 h-5"),
          el("h3", "text-sm font-semibold text-gray-700", periodo.nome)
        );
        secao.append(cabecalho);

        const itens = doDia.filter(a =>
          periodoDaAtividade(a.inicio || "") === periodo.nome
        );

        if (!itens.length) {
          secao.append(el("p", "text-sm text-gray-400 pl-7", "Livre"));
        }

        itens.forEach(a => {
          const card = el(
            "article",
            "border border-gray-200 rounded-xl p-3 flex items-center gap-3"
          );

          const faixa = el(
            "div",
            "w-1 self-stretch rounded-full bg-gray-300"
          );

          const info = el("div", "flex-1 min-w-0");
          info.append(
            el("p", "font-medium break-words", a.nome || "Sem nome"),
            el(
              "p",
              "text-sm text-gray-500 mt-1",
              `${a.inicio || "--:--"} – ${a.fim || "--:--"}`
            ),
            el(
              "p",
              "text-xs text-gray-400 mt-1",
              a.tipo === "lazer" ? "Lazer" : "Trabalho físico"
            )
          );

          const acoes = el("div", "flex items-center gap-1");

          const editar = el("button", "p-2 rounded-lg hover:bg-gray-100");
          editar.type = "button";
          editar.title = "Editar atividade";
          editar.setAttribute("aria-label", "Editar " + a.nome);
          editar.append(icone("pencil"));
          editar.onclick = () => editarAtividade(a);

          const excluir = el(
            "button",
            "p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-gray-50"
          );
          excluir.type = "button";
          excluir.title = "Excluir atividade";
          excluir.setAttribute("aria-label", "Excluir " + a.nome);
          excluir.append(icone("trash-2"));
          excluir.onclick = () => excluirAtividade(a);

          acoes.append(editar, excluir);
          card.append(faixa, info, acoes);
          secao.append(card);
        });

        agenda.append(secao);
      });

      atualizarIcones();
    }

    function abrirFormulario(a = null) {
      $("form").reset();
      $("atividadeId").value = a?.id || "";
      $("tituloForm").textContent = a ? "Editar atividade" : "Nova atividade";
      $("nome").value = a?.nome || "";
      $("dia").value = String(a?.dia ?? diaSelecionado);
      $("inicio").value = a?.inicio || "";
      $("fim").value = a?.fim || "";
      $("tipo").value = a?.tipo || "trabalho_fisico";
      $("form").classList.remove("hidden");
      $("form").scrollIntoView({ behavior: "smooth", block: "start" });
      $("nome").focus();
      atualizarIcones();
    }

    function editarAtividade(a) {
      abrirFormulario(a);
    }

    async function excluirAtividade(a) {
      if (!confirm(`Excluir a atividade "${a.nome}"?`)) return;

      try {
        $("status").textContent = "Excluindo...";
        await deleteDoc(doc(db, "atividades", a.id));
        await carregar();
      } catch (erro) {
        alert("Não foi possível excluir: " + erro.message);
        $("status").textContent = "Erro ao excluir.";
      }
    }

    async function carregar() {
      $("status").textContent = "Carregando rotina...";

      try {
        const snapshot = await getDocs(tabela);
        atividades = snapshot.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));

        $("status").textContent = `${atividades.length} atividade(s) na semana`;
        mostrarDias();
        mostrarAgenda();
      } catch (erro) {
        $("status").textContent = "Erro ao carregar. Confira o Firebase.";
        console.error(erro);
      }
    }

    $("nova").onclick = () => abrirFormulario();
    $("novaFixa").onclick = () => abrirFormulario();
    $("fechar").onclick = () => $("form").classList.add("hidden");
    $("cancelar").onclick = () => $("form").classList.add("hidden");

    $("form").onsubmit = async evento => {
      evento.preventDefault();
      if (ocupado) return;

      const nome = $("nome").value.trim();
      const inicio = $("inicio").value;
      const fim = $("fim").value;

      if (!nome || !inicio || !fim) {
        alert("Preencha todos os campos.");
        return;
      }

      if (fim <= inicio) {
        alert("O horário final deve ser posterior ao inicial.");
        return;
      }

      const dados = {
        nome,
        dia: Number($("dia").value),
        inicio,
        fim,
        tipo: $("tipo").value,
        atualizadoEm: serverTimestamp()
      };

      ocupado = true;
      $("salvar").disabled = true;
      $("salvar").textContent = "Salvando...";

      try {
        const id = $("atividadeId").value;

        if (id) {
          await updateDoc(doc(db, "atividades", id), dados);
        } else {
          await addDoc(tabela, {
            ...dados,
            criadoEm: serverTimestamp()
          });
        }

        diaSelecionado = dados.dia;
        $("form").classList.add("hidden");
        await carregar();
      } catch (erro) {
        alert("Erro ao salvar: " + erro.message);
      } finally {
        ocupado = false;
        $("salvar").disabled = false;
        $("salvar").textContent = "Salvar atividade";
      }
    };

    await carregar();
    atualizarIcones();
  </script>
</body>
</html>
