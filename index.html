<script type="module">
import {
  initializeApp,
  getApps,
  getApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const statusFirebaseConfig = {
  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
};

let statusInterval = null;

function iniciarStatus(root) {
  if (root.dataset.statusInicializado === "true") return;
  root.dataset.statusInicializado = "true";

  const app = getApps().length
    ? getApp()
    : initializeApp(statusFirebaseConfig);

  const db = getFirestore(app);
  const $ = id => root.querySelector("#status-" + id);

  const diaSemana = () => new Date().getDay();

  function formatarHoras(minutos) {
    const horas = Math.floor(minutos / 60);
    const mins = minutos % 60;

    if (!horas) return `${mins}min`;
    if (!mins) return `${horas}h`;
    return `${horas}h ${String(mins).padStart(2, "0")}min`;
  }

  function minutosHora(hora) {
    if (!hora || !/^\d{2}:\d{2}$/.test(hora)) return 0;
    const [h, m] = hora.split(":").map(Number);
    return h * 60 + m;
  }

  function atualizarRelogio() {
    const agora = new Date();

    $("data").textContent = agora.toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    });

    $("agora").textContent = "Agora são " +
      agora.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
  }

  async function carregarStatus() {
    $("mensagem").textContent = "Atualizando registros...";

    try {
      const snapshot = await getDocs(collection(db, "atividades"));

      const hoje = diaSemana();

      const atividadesHoje = snapshot.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(a =>
          Number(a.dia) === hoje &&
          a.tipo === "trabalho_fisico"
        );

      let total = 0;
      let manha = 0;
      let tarde = 0;
      let noite = 0;

      atividadesHoje.forEach(a => {
        const inicio = minutosHora(a.inicio);
        const fim = minutosHora(a.fim);

        if (fim <= inicio) return;

        const duracao = fim - inicio;
        total += duracao;

        // Mantém a classificação por horário de início,
        // conforme a organização da página Rotina.
        if (a.inicio >= "05:00" && a.inicio < "12:00") {
          manha += duracao;
        } else if (a.inicio >= "12:00" && a.inicio < "18:00") {
          tarde += duracao;
        } else {
          noite += duracao;
        }
      });

      $("total").textContent = formatarHoras(total);
      $("manha").textContent = formatarHoras(manha);
      $("tarde").textContent = formatarHoras(tarde);
      $("noite").textContent = formatarHoras(noite);

      $("registros").textContent =
        `${atividadesHoje.length} atividade(s) de trabalho registradas hoje`;

      $("mensagem").textContent =
        "Dados calculados com base na rotina cadastrada.";

      atualizarRelogio();
    } catch (erro) {
      console.error("Erro ao carregar status:", erro);
      $("mensagem").textContent =
        "Não foi possível carregar os dados do Firebase.";
    }
  }

  atualizarRelogio();
  carregarStatus();

  statusInterval = setInterval(atualizarRelogio, 1000);
}

function verificarPaginaStatus() {
  const root = document.getElementById("status-app");
  if (root) iniciarStatus(root);
}

verificarPaginaStatus();

const statusObserver = new MutationObserver(verificarPaginaStatus);

statusObserver.observe(document.body, {
  childList: true,
  subtree: true
});
</script>


<script type="module">
import {
  initializeApp, getApps, getApp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getFirestore, collection, addDoc, getDocs, doc,
  updateDoc, deleteDoc, query, orderBy
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const configMetas = {
  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
};

const categorias = {
  espiritual: { nome: "Espiritual", cor: "#a78bfa" },
  saude: { nome: "Saúde", cor: "#34d399" },
  trabalho: { nome: "Trabalho", cor: "#60a5fa" },
  pessoal: { nome: "Pessoal", cor: "#fbbf24" }
};

const appMetas = getApps().length
  ? getApp()
  : initializeApp(configMetas);

const dbMetas = getFirestore(appMetas);
const colecaoMetas = collection(dbMetas, "metas");

function iniciarMetas(root) {
  if (root.dataset.metasInicializadas === "true") return;
  root.dataset.metasInicializadas = "true";

  const $ = id => root.querySelector("#metas-" + id);

  let metas = [];
  let filtro = "todas";
  let editando = null;
  let ocupado = false;

  const hoje = () => {
    const d = new Date();
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0")
    ].join("-");
  };

  function escapar(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function icones() {
    if (window.lucide) window.lucide.createIcons({ root });
  }

  function dataBR(v) {
    if (!v) return "—";
    const p = v.split("-").map(Number);
    return p.length === 3
      ? new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("pt-BR")
      : "—";
  }

  function resultados(meta) {
    return Array.isArray(meta.microResultados)
      ? meta.microResultados
      : [];
  }

  function progressoMeta(meta) {
    const micros = resultados(meta);

    if (micros.length) {
      return Math.round(
        micros.filter(m => m.concluido).length / micros.length * 100
      );
    }

    return Math.max(0, Math.min(100, Number(meta.progresso) || 0));
  }

  function abrirFormulario(meta = null) {
    editando = meta?.id || null;
    $("form").reset();

    $("nome").value = meta?.nome || "";
    $("tipo").value = meta?.tipo || "espiritual";
    $("inicio").value = meta?.inicio || hoje();
    $("fim").value = meta?.fim || "";
    $("pct").value = meta?.progresso ?? 0;
    $("valor-pct").textContent = $("pct").value;

    $("titulo-form").textContent = meta ? "Editar meta" : "Nova meta";
    $("salvar").textContent = "Salvar meta";
    $("form").classList.remove("hidden");

    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
    icones();
  }

  function fecharFormulario() {
    $("form").classList.add("hidden");
    editando = null;
  }

  async function carregar() {
    $("mensagem").textContent = "Carregando metas...";

    try {
      const snap = await getDocs(
        query(colecaoMetas, orderBy("criadoEm", "desc"))
      );

      metas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderizar();
      $("mensagem").textContent = "";
    } catch (e) {
      console.error(e);
      $("mensagem").textContent =
        "Erro ao carregar metas. Verifique o Firestore e suas regras.";
    }
  }

  function renderizar() {
    $("total").textContent = metas.length;

    $("ativas").textContent =
      metas.filter(m => progressoMeta(m) < 100).length;

    $("feitas").textContent =
      metas.filter(m => progressoMeta(m) >= 100).length;

    const itens = metas.filter(m =>
      filtro === "todas" || m.tipo === filtro
    );

    $("vazio").classList.toggle("hidden", itens.length > 0);

    $("lista").innerHTML = itens.map(m => {
      const cat = categorias[m.tipo] || categorias.pessoal;
      const cor = cat.cor;
      const micros = resultados(m);
      const pct = progressoMeta(m);

      const inicioMs = m.inicio
        ? new Date(m.inicio + "T00:00:00").getTime()
        : 0;

      const fimMs = m.fim
        ? new Date(m.fim + "T23:59:59").getTime()
        : 0;

      const agora = Date.now();

      const tempo = !inicioMs || !fimMs ? 0 :
        fimMs <= inicioMs ? (agora >= fimMs ? 100 : 0) :
        Math.max(0, Math.min(100,
          Math.round((agora - inicioMs) / (fimMs - inicioMs) * 100)
        ));

      const restante = fimMs
        ? Math.ceil((fimMs - agora) / 86400000)
        : null;

      const status = pct >= 100 ? "Concluída" :
        inicioMs && agora < inicioMs ? "Agendada" :
        fimMs && agora > fimMs ? "Prazo encerrado" :
        "Em andamento";

      const microsFeitos = micros.filter(x => x.concluido).length;
      const id = escapar(m.id);

      const listaMicros = micros.map((micro, i) => `
        <label class="flex items-center gap-3 py-2.5 cursor-pointer">
          <input type="checkbox"
            class="micro-check"
            style="--meta-cor:${cor}"
            data-acao="micro-toggle"
            data-id="${id}"
            data-index="${i}"
            ${micro.concluido ? "checked" : ""}>
          <span class="text-sm flex-1 min-w-0 break-words ${micro.concluido ? "micro-feito" : "text-zinc-300"}">
            ${escapar(micro.nome)}
          </span>
          <button type="button"
            class="text-zinc-600 hover:text-red-400 p-1"
            data-acao="remover-micro"
            data-id="${id}"
            data-index="${i}"
            aria-label="Excluir micro-resultado"
            title="Excluir">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </label>
      `).join("");

      return `
        <article data-meta-card="${id}"
          class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
          <div class="flex items-start gap-3">
            <div class="w-1 self-stretch rounded-full shrink-0"
              style="background:${cor}"></div>

            <div class="flex-1 min-w-0">
              <div class="flex justify-between gap-2 items-start">
                <h3 class="font-semibold break-words">${escapar(m.nome)}</h3>
                <span class="cat shrink-0"
                  style="color:${cor};background:${cor}18">
                  ${cat.nome}
                </span>
              </div>

              <p class="text-xs text-zinc-500 mt-2">
                ${dataBR(m.inicio)} → ${dataBR(m.fim)}
              </p>

              <div class="flex justify-between text-xs mt-4 mb-2">
                <span class="text-zinc-400">Tempo decorrido</span>
                <span>${tempo}%</span>
              </div>
              <div class="progress">
                <div style="width:${tempo}%;background:${cor};opacity:.55"></div>
              </div>

              <div class="flex justify-between text-xs mt-4 mb-2">
                <span class="text-zinc-400">Realização</span>
                <span>${pct}%</span>
              </div>
              <div class="progress">
                <div style="width:${pct}%;background:${cor}"></div>
              </div>

              <div class="text-xs text-zinc-500 mt-2">
                ${pct >= 100 ? "Meta concluída" :
                  restante === null ? "Sem prazo" :
                  restante < 0 ? "Prazo encerrado" :
                  restante + " dias restantes"}
                · ${status}
              </div>

              <div class="border-t border-zinc-800 mt-4 pt-4">
                <div class="flex justify-between items-center mb-2">
                  <h4 class="text-sm font-semibold">Micro-resultados</h4>
                  <span class="text-xs text-zinc-500">
                    ${microsFeitos}/${micros.length}
                  </span>
                </div>

                ${micros.length
                  ? `<div class="divide-y divide-zinc-800">${listaMicros}</div>`
                  : `<p class="text-xs text-zinc-500 py-2">Adicione pequenas etapas para avançar nesta meta.</p>`}

                <form data-form-micro="${id}" class="flex gap-2 mt-3">
                  <input name="microNome" maxlength="120"
                    placeholder="Próximo pequeno resultado..."
                    aria-label="Novo micro-resultado"
                    required
                    class="min-w-0 flex-1 text-sm">
                  <button type="submit"
                    class="rounded-xl px-3 bg-zinc-800 text-white"
                    aria-label="Adicionar micro-resultado"
                    title="Adicionar">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </form>
              </div>

              <div class="flex justify-end gap-4 items-center mt-4 pt-3 border-t border-zinc-800 text-zinc-400">
                ${pct < 100 ? `
                  <button type="button" data-acao="concluir"
                    data-id="${id}" title="Concluir meta"
                    class="text-xs flex items-center gap-1">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> Concluir
                  </button>` : ""}

                <button type="button" data-acao="editar"
                  data-id="${id}" title="Editar meta">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>

                <button type="button" data-acao="excluir"
                  data-id="${id}" title="Excluir meta">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        </article>`;
    }).join("");

    root.querySelectorAll("#metas-filtros [data-f]").forEach(b => {
      const ativo = b.dataset.f === filtro;
      b.className = "filter shrink-0 rounded-full px-4 py-2 text-xs " +
        (ativo ? "bg-white text-black" : "bg-zinc-900 text-zinc-400");
      b.setAttribute("aria-pressed", String(ativo));
    });

    icones();
  }

  async function atualizarMeta(id, alteracoes) {
    await updateDoc(doc(dbMetas, "metas", id), alteracoes);
    await carregar();
  }

  async function salvar(evento) {
    evento.preventDefault();
    if (ocupado) return;

    const nome = $("nome").value.trim();
    const inicio = $("inicio").value;
    const fim = $("fim").value;

    if (!nome || !inicio || !fim) {
      alert("Preencha todos os campos.");
      return;
    }

    if (fim < inicio) {
      alert("A data final deve ser igual ou posterior à inicial.");
      return;
    }

    const dados = {
      nome,
      tipo: $("tipo").value,
      inicio,
      fim,
      progresso: Number($("pct").value),
      concluida: Number($("pct").value) === 100
    };

    ocupado = true;
    $("salvar").disabled = true;
    $("salvar").textContent = "Salvando...";

    try {
      if (editando) {
        const atual = metas.find(m => m.id === editando);
        const micros = resultados(atual || {});

        await updateDoc(doc(dbMetas, "metas", editando), {
          ...dados,
          ...(micros.length ? {
            progresso: Math.round(
              micros.filter(x => x.concluido).length / micros.length * 100
            ),
            concluida: micros.every(x => x.concluido)
          } : {})
        });
      } else {
        await addDoc(colecaoMetas, {
          ...dados,
          microResultados: [],
          criadoEm: Date.now()
        });
      }

      fecharFormulario();
      await carregar();
    } catch (e) {
      console.error(e);
      alert("Erro ao salvar a meta.");
    } finally {
      ocupado = false;
      $("salvar").disabled = false;
      $("salvar").textContent = "Salvar meta";
    }
  }

  async function executarAcao(acao, id, indice) {
    const meta = metas.find(m => m.id === id);
    if (!meta) return;

    try {
      if (acao === "editar") {
        abrirFormulario(meta);
        return;
      }

      if (acao === "excluir") {
        if (!confirm("Excluir esta meta e seus micro-resultados?")) return;
        await deleteDoc(doc(dbMetas, "metas", id));
        await carregar();
        return;
      }

      if (acao === "concluir") {
        if (resultados(meta).length) {
          const micros = resultados(meta).map(m => ({
            ...m,
            concluido: true
          }));
          await atualizarMeta(id, {
            microResultados: micros,
            progresso: 100,
            concluida: true
          });
        } else {
          await atualizarMeta(id, {
            progresso: 100,
            concluida: true
          });
        }
        return;
      }

      if (acao === "micro-toggle" || acao === "remover-micro") {
        const micros = resultados(meta).map(m => ({ ...m }));

        if (!micros[indice]) return;

        if (acao === "micro-toggle") {
          micros[indice].concluido = !micros[indice].concluido;
        } else {
          if (!confirm("Remover este micro-resultado?")) return;
          micros.splice(indice, 1);
        }

        const pct = micros.length
          ? Math.round(micros.filter(m => m.concluido).length / micros.length * 100)
          : 0;

        await atualizarMeta(id, {
          microResultados: micros,
          progresso: pct,
          concluida: micros.length > 0 && pct === 100
        });
      }
    } catch (e) {
      console.error(e);
      alert("Não foi possível atualizar. Tente novamente.");
    }
  }

  async function adicionarMicro(evento, id) {
    evento.preventDefault();

    const form = evento.target;
    const campo = form.elements.microNome;
    const nome = campo.value.trim();

    if (!nome) return;

    const meta = metas.find(m => m.id === id);
    if (!meta) return;

    const botao = form.querySelector('button[type="submit"]');
    if (botao) botao.disabled = true;

    try {
      const micros = [
        ...resultados(meta),
        {
          id: Date.now().toString() + "-" +
            Math.random().toString(36).slice(2, 8),
          nome,
          concluido: false
        }
      ];

      const pct = Math.round(
        micros.filter(m => m.concluido).length / micros.length * 100
      );

      await atualizarMeta(id, {
        microResultados: micros,
        progresso: pct,
        concluida: false
      });
    } catch (e) {
      console.error(e);
      alert("Não foi possível adicionar o micro-resultado.");
      if (botao) botao.disabled = false;
    }
  }

  $("nova").addEventListener("click", () => abrirFormulario());
  $("cancelar").addEventListener("click", fecharFormulario);

  $("pct").addEventListener("input", () => {
    $("valor-pct").textContent = $("pct").value;
  });

  $("form").addEventListener("submit", salvar);

  $("filtros").addEventListener("click", evento => {
    const b = evento.target.closest("[data-f]");
    if (!b) return;
    filtro = b.dataset.f;
    renderizar();
  });

  $("lista").addEventListener("submit", evento => {
    const form = evento.target.closest("[data-form-micro]");
    if (!form) return;
    adicionarMicro(evento, form.dataset.formMicro);
  });

  $("lista").addEventListener("change", evento => {
    const campo = evento.target.closest('[data-acao="micro-toggle"]');
    if (!campo) return;

    const meta = metas.find(m => m.id === campo.dataset.id);
    if (!meta) return;

    const indice = Number(campo.dataset.index);
    const micros = resultados(meta);
    if (!micros[indice]) return;

    executarAcao("micro-toggle", campo.dataset.id, indice);
  });

  $("lista").addEventListener("click", evento => {
    const botao = evento.target.closest("button[data-acao]");
    if (!botao) return;

    executarAcao(
      botao.dataset.acao,
      botao.dataset.id,
      Number(botao.dataset.index)
    );
  });

  $("voltar").addEventListener("click", () => {
    if (history.length > 1) history.back();
    else location.href = "/";
  });

  carregar();
}

function verificarMetas() {
  const root = document.getElementById("metas-app");
  if (root && root.dataset.metasInicializadas !== "true") {
    iniciarMetas(root);
  }
}

verificarMetas();

const observadorMetas = new MutationObserver(verificarMetas);
observadorMetas.observe(document.body, {
  childList: true,
  subtree: true
});
</script>


<script type="module">
import {
  initializeApp,
  getApps,
  getApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
};

let db;

const dias = [
  { id: 1, nome: "Segunda", curto: "SEG" },
  { id: 2, nome: "Terça", curto: "TER" },
  { id: 3, nome: "Quarta", curto: "QUA" },
  { id: 4, nome: "Quinta", curto: "QUI" },
  { id: 5, nome: "Sexta", curto: "SEX" },
  { id: 6, nome: "Sábado", curto: "SÁB" },
  { id: 0, nome: "Domingo", curto: "DOM" }
];

const periodos = [
  { nome: "Manhã", icone: "sun" },
  { nome: "Tarde", icone: "sunset" },
  { nome: "Noite", icone: "moon" }
];

function inicializarRotina(root) {
  if (root.dataset.rotinaInicializada === "true") return;

  root.dataset.rotinaInicializada = "true";

  if (!db) {
    const app = getApps().length
      ? getApp()
      : initializeApp(firebaseConfig);

    db = getFirestore(app);
  }

  const tabela = collection(db, "atividades");
  const $ = id => root.querySelector(`#${id}`);

  let diaSelecionado = new Date().getDay();
  let atividades = [];
  let ocupado = false;

  function icone(nome, classe = "w-4 h-4") {
    const i = document.createElement("i");
    i.setAttribute("data-lucide", nome);
    i.className = classe;
    return i;
  }

  function el(tag, classe = "", texto = "") {
    const node = document.createElement(tag);
    node.className = classe;
    node.textContent = texto;
    return node;
  }

  function atualizarIcones() {
    if (window.lucide) {
      window.lucide.createIcons({ root });
    }
  }

  function periodoDaAtividade(hora) {
    if (hora < "12:00" && hora >= "05:00") return "Manhã";
    if (hora >= "12:00" && hora < "18:00") return "Tarde";
    return "Noite";
  }

  function mostrarDias() {
    const nav = $("dias");
    nav.replaceChildren();

    dias.forEach(dia => {
      const ativo = dia.id === diaSelecionado;

      const botao = el(
        "button",
        `rounded-xl py-3 flex flex-col items-center gap-1 ${
          ativo
            ? "bg-gray-900 text-white"
            : "bg-gray-50 text-gray-600"
        }`
      );

      botao.type = "button";
      botao.setAttribute("aria-pressed", String(ativo));
      botao.setAttribute("aria-label", dia.nome);

      botao.append(
        el("span", "text-xs font-semibold", dia.curto),
        el(
          "span",
          "text-xs opacity-70",
          String(dia.id === 0 ? 7 : dia.id)
        )
      );

      botao.addEventListener("click", () => {
        diaSelecionado = dia.id;
        mostrarDias();
        mostrarAgenda();
      });

      nav.append(botao);
    });
  }

  function mostrarAgenda() {
    const agenda = $("agenda");
    agenda.replaceChildren();

    const dia = dias.find(d => d.id === diaSelecionado);

    agenda.append(
      el("h2", "text-lg font-semibold", dia.nome)
    );

    const doDia = atividades
      .filter(a => Number(a.dia) === diaSelecionado)
      .sort((a, b) =>
        (a.inicio || "").localeCompare(b.inicio || "")
      );

    periodos.forEach(periodo => {
      const secao = el("section", "space-y-3");

      const cabecalho = el(
        "div",
        "flex items-center gap-2 text-gray-500"
      );

      cabecalho.append(
        icone(periodo.icone, "w-5 h-5"),
        el("h3", "text-sm font-semibold text-gray-700", periodo.nome)
      );

      secao.append(cabecalho);

      const itens = doDia.filter(a =>
        periodoDaAtividade(a.inicio || "") === periodo.nome
      );

      if (!itens.length) {
        secao.append(
          el("p", "text-sm text-gray-400 pl-7", "Livre")
        );
      }

      itens.forEach(a => {
        const card = el(
          "article",
          "border border-gray-200 rounded-xl p-3 flex items-center gap-3"
        );

        const faixa = el(
          "div",
          "w-1 self-stretch rounded-full bg-gray-300"
        );

        const info = el("div", "flex-1 min-w-0");

        info.append(
          el("p", "font-medium break-words", a.nome || "Sem nome"),
          el(
            "p",
            "text-sm text-gray-500 mt-1",
            `${a.inicio || "--:--"} – ${a.fim || "--:--"}`
          ),
          el(
            "p",
            "text-xs text-gray-400 mt-1",
            a.tipo === "lazer" ? "Lazer" : "Trabalho físico"
          )
        );

        const acoes = el("div", "flex items-center gap-1");

        const editar = el(
          "button",
          "p-2 rounded-lg hover:bg-gray-100"
        );

        editar.type = "button";
        editar.title = "Editar atividade";
        editar.setAttribute("aria-label", "Editar " + a.nome);
        editar.append(icone("pencil"));
        editar.addEventListener("click", () => abrirFormulario(a));

        const excluir = el(
          "button",
          "p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-gray-50"
        );

        excluir.type = "button";
        excluir.title = "Excluir atividade";
        excluir.setAttribute("aria-label", "Excluir " + a.nome);
        excluir.append(icone("trash-2"));
        excluir.addEventListener("click", () => excluirAtividade(a));

        acoes.append(editar, excluir);
        card.append(faixa, info, acoes);
        secao.append(card);
      });

      agenda.append(secao);
    });

    atualizarIcones();
  }

  function abrirFormulario(a = null) {
    $("form").reset();

    $("atividadeId").value = a?.id || "";
    $("tituloForm").textContent = a
      ? "Editar atividade"
      : "Nova atividade";

    $("nome").value = a?.nome || "";
    $("dia").value = String(a?.dia ?? diaSelecionado);
    $("inicio").value = a?.inicio || "";
    $("fim").value = a?.fim || "";
    $("tipo").value = a?.tipo || "trabalho_fisico";

    $("form").classList.remove("hidden");
    $("form").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

    $("nome").focus();
    atualizarIcones();
  }

  async function excluirAtividade(a) {
    if (!confirm(`Excluir a atividade "${a.nome}"?`)) return;

    try {
      $("status").textContent = "Excluindo...";

      await deleteDoc(doc(db, "atividades", a.id));
      await carregar();
    } catch (erro) {
      console.error(erro);
      alert("Não foi possível excluir: " + erro.message);
      $("status").textContent = "Erro ao excluir.";
    }
  }

  async function carregar() {
    $("status").textContent = "Carregando rotina...";

    try {
      const snapshot = await getDocs(tabela);

      atividades = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      $("status").textContent =
        `${atividades.length} atividade(s) na semana`;

      mostrarDias();
      mostrarAgenda();
    } catch (erro) {
      console.error("Erro ao carregar rotina:", erro);
      $("status").textContent =
        "Erro ao carregar. Confira o Firebase.";
    }
  }

  $("nova").addEventListener("click", () => abrirFormulario());
  $("novaFixa").addEventListener("click", () => abrirFormulario());

  $("fechar").addEventListener("click", () => {
    $("form").classList.add("hidden");
  });

  $("cancelar").addEventListener("click", () => {
    $("form").classList.add("hidden");
  });

  $("form").addEventListener("submit", async evento => {
    evento.preventDefault();

    if (ocupado) return;

    const nome = $("nome").value.trim();
    const inicio = $("inicio").value;
    const fim = $("fim").value;

    if (!nome || !inicio || !fim) {
      alert("Preencha todos os campos.");
      return;
    }

    if (fim <= inicio) {
      alert("O horário final deve ser posterior ao inicial.");
      return;
    }

    const dados = {
      nome,
      dia: Number($("dia").value),
      inicio,
      fim,
      tipo: $("tipo").value,
      atualizadoEm: serverTimestamp()
    };

    ocupado = true;
    $("salvar").disabled = true;
    $("salvar").textContent = "Salvando...";

    try {
      const id = $("atividadeId").value;

      if (id) {
        await updateDoc(doc(db, "atividades", id), dados);
      } else {
        await addDoc(tabela, {
          ...dados,
          criadoEm: serverTimestamp()
        });
      }

      diaSelecionado = dados.dia;
      $("form").classList.add("hidden");

      await carregar();
    } catch (erro) {
      console.error("Erro ao salvar atividade:", erro);
      alert("Erro ao salvar: " + erro.message);
    } finally {

  });

}

});

observadorRotina.observe(document.body, {

<script type="module">
(async () => {
  try {
    const { db } = await import("./firebase/config.js");

    const {
      collection, addDoc, getDocs, updateDoc,
      deleteDoc, doc, serverTimestamp
    } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );

    const el = id => document.getElementById(id);
    let filtroAtual = "todas";

    const prazos = {
      "3dias": "3 dias",
      "7dias": "7 dias",
      "3meses": "3 meses",
      "6meses": "6 meses",
      "1ano": "1 ano",
      "3anos": "3 anos",
      "5anos": "5 anos"
    };

    const observer = new MutationObserver(() => iniciar());
    observer.observe(el("content") || document.body, {
      childList: true,
      subtree: true
    });

    function iniciar() {
      const formulario = el("metasForm");
      if (!formulario || !el("listaMetas") || formulario.dataset.initMetas) return;

      formulario.dataset.initMetas = "true";

      window.novaMeta = () => {
        formulario.reset();
        el("metaId").value = "";
        el("prazoMeta").value = "7dias";
        el("statusMeta").value = "planejada";
        formulario.classList.remove("hidden");
        formulario.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      window.cancelarMeta = () => {
        formulario.reset();
        el("metaId").value = "";
        formulario.classList.add("hidden");
      };

      el("filtrosMetas")?.addEventListener("click", event => {
        const botao = event.target.closest("[data-filtro]");
        if (!botao) return;

        filtroAtual = botao.dataset.filtro;

        el("filtrosMetas").querySelectorAll("[data-filtro]").forEach(item => {
          item.className = item === botao
            ? "rounded-full bg-blue-600 px-4 py-2 text-sm font-medium text-white"
            : "rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300";
        });

        carregarMetas();
      });

      formulario.addEventListener("submit", async event => {
        event.preventDefault();

        const id = el("metaId").value;
        const botao = formulario.querySelector('[type="submit"]');

        const dados = {
          titulo: el("tituloMeta").value.trim(),
          prazo: el("prazoMeta").value,
          dataLimite: el("dataLimiteMeta").value,
          desfrute: el("desfruteMeta").value.trim(),
          acoes: el("acoesMeta").value.trim(),
          status: el("statusMeta").value,
          atualizadoEm: serverTimestamp()
        };

        if (!dados.titulo || !dados.acoes) {
          alert("Preencha o título e as ações da meta.");
          return;
        }

        botao.disabled = true;
        botao.textContent = "Salvando...";

        try {
          if (id) {
            await updateDoc(doc(db, "metas", id), dados);
          } else {
            await addDoc(collection(db, "metas"), {
              ...dados,
              criadoEm: serverTimestamp()
            });
          }

          formulario.reset();
          el("metaId").value = "";
          formulario.classList.add("hidden");
          await carregarMetas();
        } catch (error) {
          console.error("Erro ao salvar meta:", error);
          alert("Não foi possível salvar a meta. Verifique as regras do Firestore.");
        } finally {
          botao.disabled = false;
          botao.textContent = "Salvar meta";
        }
      });

      carregarMetas();
    }

    async function carregarMetas() {
      const lista = el("listaMetas");
      if (!lista) return;

      lista.replaceChildren();

      try {
        const snapshot = await getDocs(collection(db, "metas"));
        let metas = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        const ordem = ["3dias", "7dias", "3meses", "6meses", "1ano", "3anos", "5anos"];
        metas.sort((a, b) => ordem.indexOf(a.prazo) - ordem.indexOf(b.prazo));

        el("totalMetas").textContent = metas.length;
        el("metas7Dias").textContent =
          metas.filter(m => ["3dias", "7dias"].includes(m.prazo)).length;
        el("metas3Meses").textContent =
          metas.filter(m => m.prazo === "3meses").length;
        el("metasConcluidas").textContent =
          metas.filter(m => m.status === "concluida").length;

        if (filtroAtual !== "todas") {
          metas = metas.filter(m => m.prazo === filtroAtual);
        }

        if (!metas.length) {
          const vazio = document.createElement("p");
          vazio.className = "col-span-full rounded-2xl border border-white/10 p-8 text-center text-sm text-zinc-400";
          vazio.textContent = "Nenhuma meta neste período.";
          lista.append(vazio);
          return;
        }

        metas.forEach(meta => {
          const card = document.createElement("article");
          card.className = "space-y-4 rounded-2xl border border-white/10 bg-[#111] p-5";

          const titulo = document.createElement("h2");
          titulo.className = "break-words text-lg font-bold text-white";
          titulo.textContent = meta.titulo || "Meta sem título";

          const prazo = document.createElement("span");
          prazo.className = "inline-block rounded-full bg-blue-500/10 px-3 py-1 text-xs text-blue-400";
          prazo.textContent = prazos[meta.prazo] || "Sem prazo";

          const status = document.createElement("p");
          status.className = "text-xs uppercase tracking-wider text-zinc-500";
          status.textContent = "Status: " + (meta.status || "planejada");

          const data = document.createElement("p");
          data.className = "text-sm text-zinc-400";
          data.textContent = meta.dataLimite
            ? "Data-alvo: " + meta.dataLimite.split("-").reverse().join("/")
            : "Data-alvo não definida";

          const desfruteTitulo = document.createElement("h3");
          desfruteTitulo.className = "text-xs font-bold uppercase text-zinc-500";
          desfruteTitulo.textContent = "Desfrute";

          const desfrute = document.createElement("p");
          desfrute.className = "whitespace-pre-wrap text-sm text-zinc-300";
          desfrute.textContent = meta.desfrute || "Não informado.";

          const acoesTitulo = document.createElement("h3");
          acoesTitulo.className = "text-xs font-bold uppercase text-zinc-500";
          acoesTitulo.textContent = "Ações";

          const acoes = document.createElement("p");
          acoes.className = "whitespace-pre-wrap break-words text-sm leading-6 text-zinc-300";
          acoes.textContent = meta.acoes || "Nenhuma ação definida.";

          const botoes = document.createElement("div");
          botoes.className = "flex gap-4 border-t border-white/10 pt-4";

          const editar = document.createElement("button");
          editar.type = "button";
          editar.className = "text-sm text-blue-400";
          editar.textContent = "Editar";

          editar.onclick = () => {
            el("metaId").value = meta.id;
            el("tituloMeta").value = meta.titulo || "";
            el("prazoMeta").value = meta.prazo || "7dias";
            el("dataLimiteMeta").value = meta.dataLimite || "";
            el("desfruteMeta").value = meta.desfrute || "";
            el("acoesMeta").value = meta.acoes || "";
            el("statusMeta").value = meta.status || "planejada";

            el("metasForm").classList.remove("hidden");
            el("metasForm").scrollIntoView({ behavior: "smooth", block: "start" });
          };

          const excluir = document.createElement("button");
          excluir.type = "button";
          excluir.className = "text-sm text-red-400";
          excluir.textContent = "Excluir";

          excluir.onclick = async () => {
            if (!confirm(`Excluir a meta "${meta.titulo}"?`)) return;

            try {
              await deleteDoc(doc(db, "metas", meta.id));
              await carregarMetas();
            } catch (error) {
              console.error("Erro ao excluir meta:", error);
              alert("Não foi possível excluir a meta.");
            }
          };

          botoes.append(editar, excluir);
          card.append(titulo, prazo, status, data, desfruteTitulo, desfrute, acoesTitulo, acoes, botoes);
          lista.append(card);
        });
      } catch (error) {
        console.error("Erro ao carregar metas:", error);
        lista.textContent = "Erro ao carregar metas. Verifique o Firebase.";
      }
    }

    iniciar();
  } catch (error) {
    console.error("Módulo de metas:", error);
  }
})();
</script>


<script type="module">
(async () => {
  try {
    const { db } = await import("./firebase/config.js");

    const {
      collection,
      addDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      doc,
      serverTimestamp
    } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );

    const el = id => document.getElementById(id);

    async function iniciarCurriculo() {
      const historiaForm = el("historiaForm");
      const listaHistorias = el("listaHistorias");
      const academicoForm = el("academicoForm");
      const listaAcademica = el("listaAcademica");
      const raiz = el("gestaoCurriculo") || historiaForm?.parentElement;

      if (!historiaForm || !listaHistorias) return;
      if (historiaForm.dataset.initHistorias === "true") return;

      historiaForm.dataset.initHistorias = "true";

      // ==========================================
      // ABAS
      // ==========================================

      function abrirAba(nome) {
        document.querySelectorAll("[data-cv-tab]").forEach(botao => {
          const ativo = botao.dataset.cvTab === nome;

          botao.classList.toggle("bg-orange-600", ativo);
          botao.classList.toggle("bg-zinc-800", !ativo);
          botao.classList.toggle("text-zinc-300", !ativo);
        });

        document.querySelectorAll("[data-cv-panel]").forEach(painel => {
          painel.classList.toggle(
            "hidden",
            painel.dataset.cvPanel !== nome
          );
        });
      }

      document.querySelectorAll("[data-cv-tab]").forEach(botao => {
        botao.addEventListener("click", () => abrirAba(botao.dataset.cvTab));
      });

      // ==========================================
      // UTILITÁRIOS
      // ==========================================

      function elemento(tag, classe, texto = "") {
        const node = document.createElement(tag);
        node.className = classe;
        node.textContent = texto;
        return node;
      }

      function formatarData(data) {
        if (!data) return "";
        const partes = data.split("-");
        return partes.length === 3
          ? `${partes[2]}/${partes[1]}/${partes[0]}`
          : data;
      }

      function criarCard() {
        return elemento(
          "article",
          "rounded-2xl border border-white/10 bg-zinc-900 p-5 space-y-3"
        );
      }

      function criarAcoes(card, editarFn, excluirFn) {
        const acoes = elemento("div", "flex gap-4");

        const editar = elemento("button", "text-sm text-orange-400", "Editar");
        editar.type = "button";
        editar.addEventListener("click", editarFn);

        const excluir = elemento("button", "text-sm text-red-400", "Excluir");
        excluir.type = "button";
        excluir.addEventListener("click", excluirFn);

        acoes.append(editar, excluir);
        card.append(acoes);
      }

      // ==========================================
      // HISTÓRICO PROFISSIONAL
      // Mantém a coleção e os IDs existentes
      // ==========================================

      window.novaHistoria = () => {
        historiaForm.reset();
        el("historiaId").value = "";
        el("dataAte").disabled = false;
        historiaForm.classList.remove("hidden");
        historiaForm.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      window.cancelarHistoria = () => {
        historiaForm.reset();
        el("historiaId").value = "";
        el("dataAte").disabled = false;
        historiaForm.classList.add("hidden");
      };

      el("cargoAtual").addEventListener("change", evento => {
        el("dataAte").disabled = evento.target.checked;
        if (evento.target.checked) el("dataAte").value = "";
      });

      async function carregarHistorias() {
        listaHistorias.replaceChildren(
          elemento("p", "text-sm text-zinc-400", "Carregando histórico...")
        );

        try {
          const snapshot = await getDocs(collection(db, "historias"));

          const registros = snapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          registros.sort((a, b) =>
            (b.dataDe || "").localeCompare(a.dataDe || "")
          );

          listaHistorias.replaceChildren();

          if (!registros.length) {
            listaHistorias.textContent = "Nenhum registro cadastrado.";
            return;
          }

          registros.forEach(h => {
            const card = criarCard();

            card.append(
              elemento("h2", "text-lg font-bold text-white", h.cargo || "")
            );

            if (h.empresa) {
              card.append(
                elemento("p", "text-sm text-zinc-300", h.empresa)
              );
            }

            card.append(
              elemento(
                "p",
                "text-sm text-orange-400",
                `${formatarData(h.dataDe) || "—"} — ${
                  h.dataAte ? formatarData(h.dataAte) : "Atual"
                }`
              )
            );

            card.append(
              elemento(
                "p",
                "whitespace-pre-wrap text-sm text-zinc-300",
                h.funcoes || ""
              )
            );

            criarAcoes(
              card,
              () => {
                el("historiaId").value = h.id;
                el("cargo").value = h.cargo || "";
                el("dataDe").value = h.dataDe || "";
                el("dataAte").value = h.dataAte || "";
                el("funcoes").value = h.funcoes || "";

                el("cargoAtual").checked = !h.dataAte;
                el("dataAte").disabled = !h.dataAte;

                // Compatibilidade: empresa é um campo opcional novo.
                if (el("empresa")) el("empresa").value = h.empresa || "";

                historiaForm.classList.remove("hidden");
                historiaForm.scrollIntoView({
                  behavior: "smooth",
                  block: "start"
                });
              },
              async () => {
                if (!confirm("Deseja excluir este registro?")) return;

                try {
                  await deleteDoc(doc(db, "historias", h.id));
                  await carregarHistorias();
                } catch (error) {
                  console.error("Erro ao excluir história:", error);
                  alert("Não foi possível excluir o registro.");
                }
              }
            );

            listaHistorias.append(card);
          });
        } catch (error) {
          console.error("Erro ao carregar histórias:", error);
          listaHistorias.textContent =
            "Erro ao carregar. Verifique o Firebase.";
        }
      }

      historiaForm.addEventListener("submit", async event => {
        event.preventDefault();

        const id = el("historiaId").value;
        const dataDe = el("dataDe").value;
        const dataAte = el("cargoAtual").checked ? "" : el("dataAte").value;

        if (dataAte && dataAte < dataDe) {
          alert("A data final não pode ser anterior à data inicial.");
          return;
        }

        const botao = historiaForm.querySelector('[type="submit"]');
        botao.disabled = true;

        try {
          const dados = {
            cargo: el("cargo").value.trim(),
            dataDe,
            dataAte,
            funcoes: el("funcoes").value.trim(),
            atualizadoEm: serverTimestamp()
          };

          if (el("empresa")) {
            dados.empresa = el("empresa").value.trim();
          }

          if (id) {
            await updateDoc(doc(db, "historias", id), dados);
          } else {
            await addDoc(collection(db, "historias"), {
              ...dados,
              criadoEm: serverTimestamp()
            });
          }

          historiaForm.reset();
          el("historiaId").value = "";
          el("dataAte").disabled = false;
          historiaForm.classList.add("hidden");

          await carregarHistorias();
        } catch (error) {
          console.error("Erro ao salvar história:", error);
          alert("Não foi possível salvar. Verifique as regras do Firestore.");
        } finally {
          botao.disabled = false;
        }
      });

      // ==========================================
      // FORMAÇÃO ACADÊMICA
      // Coleção independente: academicos
      // ==========================================

      if (academicoForm && listaAcademica) {
        window.novoAcademico = () => {
          academicoForm.reset();
          el("academicoId").value = "";
          el("academicoStatus").value = "Em andamento";
          academicoForm.classList.remove("hidden");
          academicoForm.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        };

        window.cancelarAcademico = () => {
          academicoForm.reset();
          el("academicoId").value = "";
          academicoForm.classList.add("hidden");
        };

        async function carregarAcademico() {
          listaAcademica.replaceChildren(
            elemento(
              "p",
              "text-sm text-zinc-400",
              "Carregando formação acadêmica..."
            )
          );

          try {
            const snapshot = await getDocs(collection(db, "academicos"));

            const registros = snapshot.docs.map(d => ({
              id: d.id,
              ...d.data()
            }));

            registros.sort((a, b) =>
              (b.dataDe || "").localeCompare(a.dataDe || "")
            );

            listaAcademica.replaceChildren();

            if (!registros.length) {
              listaAcademica.textContent =
                "Nenhuma formação acadêmica cadastrada.";
              return;
            }

            registros.forEach(a => {
              const card = criarCard();

              card.append(
                elemento("h2", "text-lg font-bold text-white", a.curso || "")
              );

              card.append(
                elemento("p", "text-sm text-zinc-300", a.instituicao || "")
              );

              card.append(
                elemento(
                  "p",
                  "text-sm text-orange-400",
                  [a.tipoFormacao, a.statusAcademico].filter(Boolean).join(" • ")
                )
              );

              const inicio = formatarData(a.dataDe);
              const fim = formatarData(a.dataAte);

              if (inicio || fim) {
                card.append(
                  elemento(
                    "p",
                    "text-sm text-zinc-400",
                    `${inicio || "—"} — ${fim || (
                      a.statusAcademico === "Em andamento"
                        ? "Em andamento"
                        : "Não informado"
                    )}`
                  )
                );
              }

              if (a.descricao) {
                card.append(
                  elemento(
                    "p",
                    "whitespace-pre-wrap text-sm text-zinc-300",
                    a.descricao
                  )
                );
              }

              criarAcoes(
                card,
                () => {
                  el("academicoId").value = a.id;
                  el("academicoCurso").value = a.curso || "";
                  el("academicoInstituicao").value = a.instituicao || "";
                  el("academicoTipo").value = a.tipoFormacao || "";
                  el("academicoStatus").value =
                    a.statusAcademico || "Em andamento";
                  el("academicoDe").value = a.dataDe || "";
                  el("academicoAte").value = a.dataAte || "";
                  el("academicoDescricao").value = a.descricao || "";

                  abrirAba("academico");
                  academicoForm.classList.remove("hidden");
                  academicoForm.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                  });
                },
                async () => {
                  if (!confirm("Deseja excluir esta formação acadêmica?")) {
                    return;
                  }

                  try {
                    await deleteDoc(doc(db, "academicos", a.id));
                    await carregarAcademico();
                  } catch (error) {
                    console.error("Erro ao excluir formação:", error);
                    alert("Não foi possível excluir a formação acadêmica.");
                  }
                }
              );

              listaAcademica.append(card);
            });
          } catch (error) {
            console.error("Erro ao carregar formação acadêmica:", error);
            listaAcademica.textContent =
              "Erro ao carregar formação acadêmica. Verifique o Firebase.";
          }
        }

        academicoForm.addEventListener("submit", async event => {
          event.preventDefault();

          const id = el("academicoId").value;
          const dataDe = el("academicoDe").value;
          const dataAte = el("academicoAte").value;

          if (dataDe && dataAte && dataAte < dataDe) {
            alert("A data final não pode ser anterior à data inicial.");
            return;
          }

          const botao = academicoForm.querySelector('[type="submit"]');
          botao.disabled = true;

          try {
            const dados = {
              curso: el("academicoCurso").value.trim(),
              instituicao: el("academicoInstituicao").value.trim(),
              tipoFormacao: el("academicoTipo").value,
              statusAcademico: el("academicoStatus").value,
              dataDe,
              dataAte,
              descricao: el("academicoDescricao").value.trim(),
              atualizadoEm: serverTimestamp()
            };

            if (id) {
              await updateDoc(doc(db, "academicos", id), dados);
            } else {
              await addDoc(collection(db, "academicos"), {
                ...dados,
                criadoEm: serverTimestamp()
              });
            }

            academicoForm.reset();
            el("academicoId").value = "";
            academicoForm.classList.add("hidden");

            await carregarAcademico();
          } catch (error) {
            console.error("Erro ao salvar formação acadêmica:", error);
            alert("Não foi possível salvar. Verifique as regras do Firestore.");
          } finally {
            botao.disabled = false;
          }
        });

        await carregarAcademico();
      }

      abrirAba("profissional");
      await carregarHistorias();
    }

    // Compatível com o carregamento dinâmico dentro de #content.
    let observer;
    let tentativas = 0;

    async function verificarConteudo() {
      if (!el("historiaForm")) return;

      await iniciarCurriculo();

      if (observer) observer.disconnect();
    }

    observer = new MutationObserver(() => {
      if (el("historiaForm")) {
        verificarConteudo();
      }
    });

    observer.observe(el("content") || document.body, {
      childList: true,
      subtree: true
    });

    await verificarConteudo();

  } catch (error) {
    console.error("Módulo de currículo:", error);
  }
})();
</script>

/* PERFIL ÚNICO: todos os acessos usam este mesmo documento. */
const CV_PERFIL_ID = "vinicius-araujo";
const cvPerfilRef = doc(cvDb, "professionalProfiles", CV_PERFIL_ID);

/* Histórias e formações continuam vindo das coleções originais. */
const CV_HISTORIAS = "historias";
const CV_ACADEMICOS = "academicos";

const camposCV = [
  ["name", "Nome completo"],
  ["title", "Título profissional"],
  ["summary", "Resumo profissional"],
  ["skills", "Competências"],
  ["targetRoles", "Cargos desejados"],
  ["workMode", "Modelo de trabalho"],
  ["location", "Localização"],
  ["linkedin", "LinkedIn"],
  ["portfolio", "Portfólio"],
  ["github", "GitHub"]
];

let cvUsuario = null;
let cvHistorias = [];
let cvAcademicos = [];
let cvPerfil = {};
let cvCarregando = false;

function iniciarCurriculo(root) {
  if (!root || root.dataset.cvInicializado === "true") return;
  root.dataset.cvInicializado = "true";

  const $ = id => root.querySelector("#curriculo-" + id);

  function escapar(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function valorTexto(valor) {
    if (Array.isArray(valor)) return valor.join(", ");
    if (valor && typeof valor === "object") return "";
    return String(valor ?? "");
  }

  function preencher(perfil) {
    camposCV.forEach(([campo]) => {
      const input = root.querySelector("#cv-" + campo);
      if (input) input.value = valorTexto(perfil[campo]);
    });
  }

  function lerFormulario() {
    const dados = {};
    camposCV.forEach(([campo]) => {
      const input = root.querySelector("#cv-" + campo);
      if (input) dados[campo] = input.value.trim();
    });
    return dados;
  }

  function dataBR(valor) {
    if (!valor) return "";
    const partes = String(valor).split("-");
    if (partes.length === 3) {
      return new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]))
        .toLocaleDateString("pt-BR");
    }
    return String(valor);
  }

  function atualizarIcones() {
    window.lucide?.createIcons({ root });
  }

  function renderizarHistorias() {
    $("total-historias").textContent = cvHistorias.length;

    if (!cvHistorias.length) {
      $("historias").innerHTML = `
        <div class="rounded-xl border border-neutral-800 p-4">
          <p class="text-sm text-neutral-300">Nenhuma experiência cadastrada.</p>
          <p class="mt-1 text-xs text-neutral-500">Adicione sua trajetória no módulo de histórias profissionais.</p>
        </div>`;
      return;
    }

    $("historias").innerHTML = cvHistorias.map(h => {
      const periodo = [
        dataBR(h.dataDe),
        h.cargoAtual ? "Atual" : dataBR(h.dataAte)
      ].filter(Boolean).join(" — ");

      const funcoes = Array.isArray(h.funcoes)
        ? h.funcoes
        : String(h.funcoes || "").split(/\n/).filter(Boolean);

      return `
        <article class="rounded-xl border border-neutral-800 bg-neutral-900 p-4">
          <h3 class="text-sm font-semibold">${escapar(h.cargo || "Cargo não informado")}</h3>
          ${periodo ? `<p class="mt-1 text-xs text-neutral-500">${escapar(periodo)}</p>` : ""}
          ${funcoes.length ? `
            <ul class="mt-3 space-y-2">
              ${funcoes.map(f => `
                <li class="flex gap-2 text-xs leading-relaxed text-neutral-300">
                  <span class="text-neutral-600">•</span><span>${escapar(f)}</span>
                </li>`).join("")}
            </ul>` : ""}
          <p class="mt-3 text-xs text-neutral-600">Somente leitura · Fonte: histórias</p>
        </article>`;
    }).join("");
  }

  function renderizarAcademicos() {
    $("total-academica").textContent = cvAcademicos.length;

    if (!cvAcademicos.length) {
      $("academica").innerHTML = `
        <div class="rounded-xl border border-neutral-800 p-4">
          <p class="text-sm text-neutral-300">Nenhuma formação cadastrada.</p>
          <p class="mt-1 text-xs text-neutral-500">Adicione sua formação no módulo acadêmico.</p>
        </div>`;
      return;
    }

    const camposPossiveis = [
      ["curso", "Curso"],
      ["formacao", "Formação"],
      ["instituicao", "Instituição"],
      ["instituicaoEnsino", "Instituição"],
      ["nivel", "Nível"],
      ["tipo", "Tipo"],
      ["status", "Status"],
      ["dataDe", "Início"],
      ["dataAte", "Conclusão"],
      ["inicio", "Início"],
      ["fim", "Conclusão"],
      ["anoConclusao", "Ano de conclusão"],
      ["descricao", "Descrição"]
    ];

    $("academica").innerHTML = cvAcademicos.map(a => {
      const campos = camposPossiveis
        .filter(([chave]) => a[chave] !== undefined && a[chave] !== "")
        .map(([chave, label]) => `
          <p class="mt-2 text-xs text-neutral-400">
            <span class="text-neutral-600">${escapar(label)}:</span>
            ${escapar(
              chave.startsWith("data") || chave === "inicio" || chave === "fim"
                ? dataBR(a[chave])
                : valorTexto(a[chave])
            )}
          </p>`).join("");

      return `
        <article class="rounded-xl border border-neutral-800 bg-neutral-900 p-4">
          <h3 class="text-sm font-semibold">${escapar(a.curso || a.formacao || a.nome || a.titulo || "Formação")}</h3>
          ${campos}
          <p class="mt-3 text-xs text-neutral-600">Somente leitura · Fonte: acadêmicos</p>
        </article>`;
    }).join("");
  }

  function renderizarPendencias(perfil) {
    const pendencias = [];

    camposCV.forEach(([campo, nome]) => {
      if (!valorTexto(perfil[campo]).trim()) {
        pendencias.push({ nome, detalhe: "Preencha este campo no perfil." });
      }
    });

    if (!cvHistorias.length) {
      pendencias.push({ nome: "Experiência profissional", detalhe: "Nenhuma história encontrada no banco." });
    }

    if (!cvAcademicos.length) {
      pendencias.push({ nome: "Formação acadêmica", detalhe: "Nenhuma formação encontrada no banco." });
    }

    const preenchidos = camposCV.filter(
      ([campo]) => valorTexto(perfil[campo]).trim()
    ).length;

    const totalItens = camposCV.length + 2;
    const completos = preenchidos + (cvHistorias.length ? 1 : 0) + (cvAcademicos.length ? 1 : 0);
    const percentual = Math.round(completos / totalItens * 100);

    $("percentual").textContent = percentual + "%";
    $("barra").style.width = percentual + "%";
    $("status").textContent = pendencias.length
      ? pendencias.length + " pendência(s)"
      : "Perfil completo";

    $("pendencias").innerHTML = pendencias.length
      ? pendencias.map(p => `
        <div class="flex gap-3 rounded-xl border border-neutral-800 p-3">
          <i data-lucide="circle-alert" class="mt-0.5 h-4 w-4 shrink-0 text-neutral-500"></i>
          <div>
            <p class="text-sm text-neutral-200">${escapar(p.nome)}</p>
            <p class="mt-1 text-xs text-neutral-500">${escapar(p.detalhe)}</p>
          </div>
        </div>`).join("")
      : `<div class="rounded-xl border border-emerald-900 bg-emerald-950/30 p-3 text-sm text-emerald-300">
          Todos os campos avaliados estão preenchidos.
        </div>`;

    atualizarIcones();
  }

  async function carregar() {
    if (cvCarregando) return;
    cvCarregando = true;

    $("mensagem").textContent = "Consultando currículo...";
    $("feedback").textContent = "";

    try {
      if (!cvUsuario) {
        $("mensagem").textContent = "Faça login para consultar seu currículo.";
        return;
      }

      const [perfilSnap, historiasSnap, academicosSnap] = await Promise.all([
        getDoc(cvPerfilRef),
        getDocs(collection(cvDb, CV_HISTORIAS)),
        getDocs(collection(cvDb, CV_ACADEMICOS))
      ]);

      cvPerfil = perfilSnap.exists() ? perfilSnap.data() : {};

      cvHistorias = historiasSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      cvAcademicos = academicosSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      preencher(cvPerfil);
      renderizarHistorias();
      renderizarAcademicos();
      renderizarPendencias(cvPerfil);

      $("mensagem").textContent = perfilSnap.exists()
        ? "Currículo único carregado."
        : "Perfil ainda não cadastrado. Preencha os campos e salve.";

    } catch (erro) {
      console.error("Erro ao carregar currículo:", erro);
      $("mensagem").textContent = "Erro ao carregar. Verifique a conexão e as permissões do Firestore.";
    } finally {
      cvCarregando = false;
    }
  }

  async function salvar(evento) {
    evento.preventDefault();

    if (!cvUsuario) {
      $("feedback").textContent = "Faça login antes de salvar.";
      return;
    }

    const botao = $("salvar");
    botao.disabled = true;
    botao.textContent = "Salvando...";
    $("feedback").textContent = "";

    try {
      const dados = lerFormulario();

      await setDoc(cvPerfilRef, {
        ...dados,
        atualizadoEm: new Date().toISOString()
      }, { merge: true });

      cvPerfil = { ...cvPerfil, ...dados };
      renderizarPendencias(cvPerfil);

      $("feedback").textContent = "Currículo salvo com sucesso.";
      $("mensagem").textContent = "Perfil único atualizado.";
    } catch (erro) {
      console.error("Erro ao salvar currículo:", erro);
      $("feedback").textContent = "Não foi possível salvar. Verifique as regras do Firestore.";
    } finally {
      botao.disabled = false;
      botao.textContent = "Salvar currículo";
    }
  }

  $("form").addEventListener("submit", salvar);
  $("atualizar").addEventListener("click", carregar);

  onAuthStateChanged(cvAuth, usuario => {
    cvUsuario = usuario;

    if (usuario) {
      carregar();
    } else {
      cvPerfil = {};
      cvHistorias = [];
      cvAcademicos = [];
      preencher({});
      renderizarHistorias();
      renderizarAcademicos();
      renderizarPendencias({});
      $("mensagem").textContent = "Faça login para consultar seu currículo.";
    }
  });
}

function verificarCurriculo() {
  const root = document.getElementById("curriculo-app");
  if (root && root.dataset.cvInicializado !== "true") iniciarCurriculo(root);
}

verificarCurriculo();

const observadorCurriculo = new MutationObserver(verificarCurriculo);
observadorCurriculo.observe(document.body, { childList: true, subtree: true });
</script>

</body>

</html>
