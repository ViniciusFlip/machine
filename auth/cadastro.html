<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta — Portal OMDA</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          },

          colors: {

            ink: '#050505',
            surface: '#101010',
            line: '#242424',
            soft: '#8A8A8A',
            accent: '#013bff'

          }

        }

      }

    }

  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050505;
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(0, 0, 0, .58),
          rgba(0, 0, 0, .82)
        );
    }

    .glass {

      background: rgba(16, 16, 16, .78);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .input {

      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;

      outline: none;

      background: rgba(255,255,255,.045);
      color: white;

      font-size: 13px;

      transition:
        border-color .2s ease,
        background .2s ease;
    }

    .input::placeholder {
      color: rgba(255,255,255,.30);
    }

    .input:focus {

      border-color: rgba(1,59,255,.7);

      background: rgba(255,255,255,.07);
    }

    .button {

      transition:
        transform .2s ease,
        opacity .2s ease,
        background .2s ease;
    }

    .button:active {
      transform: scale(.96);
    }

    .button:disabled {

      opacity: .5;
      cursor: wait;
    }

  </style>

</head>


<body class="min-h-screen bg-ink font-sans text-white antialiased">


  <!-- BACKGROUND -->

  <div class="background">

    <img
      src="../assets/images/naruto.webp"
      alt=""
    >

    <div class="overlay"></div>

  </div>


  <!-- PAGE -->

  <main
    class="relative z-10 flex min-h-screen flex-col items-center justify-center px-4 py-8"
  >


    <!-- VOLTAR PARA O SITE -->

    <div class="mb-4 w-full max-w-[440px]">

      <a
        href="../"
        class="group inline-flex items-center gap-2 text-[11px] font-medium text-white/40 transition hover:text-white"
      >

        <i
          data-lucide="arrow-left"
          class="h-3.5 w-3.5 transition-transform duration-200 group-hover:-translate-x-0.5"
        ></i>

        <span>
          Voltar para o site
        </span>

      </a>

    </div>


    <!-- CARD -->

    <section
      class="glass w-full max-w-[440px] rounded-[28px] border border-white/10 p-6 shadow-2xl sm:p-8"
    >


      <!-- HEADER -->

      <div class="mb-7">

        <div
          class="mb-5 flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white text-black"
        >

          <i
            data-lucide="user-plus"
            class="h-4 w-4"
          ></i>

        </div>


        <h1
          class="text-[28px] font-bold leading-tight tracking-[-.03em]"
        >
          Criar sua conta
        </h1>


        <p
          class="mt-2 text-[13px] leading-5 text-white/40"
        >
          Crie sua conta para fazer parte do Portal OMDA.
        </p>

      </div>


      <!-- FORM -->

      <form
        id="registerForm"
        class="space-y-4"
        novalidate
      >


        <!-- NOME -->

        <div>

          <label
            for="name"
            class="mb-2 block text-[11px] font-medium text-white/45"
          >
            Nome
          </label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Como devemos chamar você?"
            class="input"
            required
          >

        </div>


        <!-- EMAIL -->

        <div>

          <label
            for="email"
            class="mb-2 block text-[11px] font-medium text-white/45"
          >
            E-mail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="seu@email.com"
            class="input"
            required
          >

        </div>


        <!-- SENHA -->

        <div>

          <label
            for="password"
            class="mb-2 block text-[11px] font-medium text-white/45"
          >
            Senha
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Crie uma senha"
            minlength="6"
            class="input"
            required
          >

        </div>


        <!-- CONFIRMAR SENHA -->

        <div>

          <label
            for="confirmPassword"
            class="mb-2 block text-[11px] font-medium text-white/45"
          >
            Confirmar senha
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Digite novamente sua senha"
            minlength="6"
            class="input"
            required
          >

        </div>


        <!-- BUTTON -->

        <button
          id="registerButton"
          type="submit"
          class="button mt-2 flex h-[52px] w-full items-center justify-center gap-3 rounded-[14px] bg-accent text-[13px] font-semibold text-white hover:bg-blue-600 disabled:hover:bg-accent"
        >

          <span>
            Criar minha conta
          </span>

          <i
            data-lucide="arrow-up-right"
            class="h-4 w-4"
          ></i>

        </button>

      </form>


      <!-- STATUS -->

      <p
        id="registerStatus"
        role="status"
        aria-live="polite"
        class="mt-4 min-h-[18px] text-center text-[11px] text-white/40"
      ></p>


      <!-- LOGIN -->

      <div
        class="mt-6 border-t border-white/10 pt-6 text-center"
      >

        <span class="text-[12px] text-white/30">
          Já possui uma conta?
        </span>

        <a
          href="./"
          class="ml-1 text-[12px] font-medium text-white transition hover:text-accent"
        >
          Entrar
        </a>

      </div>


      <!-- VERSION -->

      <div
        class="mt-6 text-center text-[9px] text-white/20"
      >
        PORTAL OMDA • v1.0.0
      </div>


    </section>

  </main>


  <!-- CADASTRO -->

  <script
    type="module"
    src="./cadastro.js?v=1.0.0"
  ></script>


  <!-- LUCIDE -->

  <script>

    lucide.createIcons();

  </script>

</body>

</html>
