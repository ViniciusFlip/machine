
<div id="metas-app" class="min-h-screen bg-zinc-950 text-zinc-50"
  style="font-family:Arial,sans-serif">

  <style>
    #metas-app input:not([type="range"]),
    #metas-app select {
      background:#18181b;
      border:1px solid #27272a;
      border-radius:10px;
      padding:11px;
      width:100%;
      color:#fff;
      outline:none;
    }
    #metas-app button { transition:.15s; }
    #metas-app .cat {
      font-size:11px;
      padding:5px 9px;
      border-radius:20px;
      font-weight:600;
    }
    #metas-app .progress {
      height:4px;
      background:#27272a;
      border-radius:9px;
      overflow:hidden;
    }
    #metas-app .progress div {
      height:100%;
      border-radius:9px;
    }
  </style>

  <main class="max-w-xl mx-auto p-4 pb-12">

    <button id="metas-voltar" type="button"
      class="flex items-center gap-2 text-sm text-zinc-400 hover:text-white py-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Voltar
    </button>

    <header class="flex justify-between items-center py-4 mb-5">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">
          Metas<span class="text-zinc-500">.</span>
        </h1>
        <p class="text-xs text-zinc-500 mt-1">Direção, tempo e progresso.</p>
      </div>

      <button id="metas-nova"
        class="bg-white text-black rounded-xl px-4 py-3 text-sm font-semibold flex gap-2 items-center">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Nova
      </button>
    </header>

    <section class="grid grid-cols-3 gap-2 mb-6">
      <div class="bg-zinc-900 rounded-xl p-3">
        <p class="text-xs text-zinc-500">Total</p>
        <p id="metas-total" class="text-xl font-bold mt-1">0</p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-3">
        <p class="text-xs text-zinc-500">Ativas</p>
        <p id="metas-ativas" class="text-xl font-bold mt-1">0</p>
      </div>
      <div class="bg-zinc-900 rounded-xl p-3">
        <p class="text-xs text-zinc-500">Concluídas</p>
        <p id="metas-feitas" class="text-xl font-bold mt-1">0</p>
      </div>
    </section>

    <form id="metas-form"
      class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-6 space-y-3">

      <h2 id="metas-titulo-form" class="font-semibold">Nova meta</h2>

      <input id="metas-nome" placeholder="Qual é a meta?"
        required maxlength="120">

      <select id="metas-tipo">
        <option value="espiritual">Espiritual</option>
        <option value="saude">Saúde</option>
        <option value="trabalho">Trabalho</option>
        <option value="pessoal">Pessoal</option>
      </select>

      <div class="grid grid-cols-2 gap-3">
        <label class="text-xs text-zinc-500">
          De
          <input id="metas-inicio" type="date" required class="mt-2">
        </label>
        <label class="text-xs text-zinc-500">
          Até
          <input id="metas-fim" type="date" required class="mt-2">
        </label>
      </div>

      <label class="block text-xs text-zinc-500">
        Realização: <span id="metas-valor-pct">0</span>%
        <input id="metas-pct" type="range" min="0" max="100"
          value="0" class="mt-2 w-full accent-white">
      </label>

      <div class="flex gap-2 pt-1">
        <button id="metas-salvar" type="submit"
          class="flex-1 bg-white text-black rounded-xl py-3 font-semibold text-sm">
          Salvar meta
        </button>
        <button id="metas-cancelar" type="button"
          class="px-4 rounded-xl bg-zinc-800 text-sm">
          Cancelar
        </button>
      </div>
    </form>

    <nav class="flex gap-2 overflow-x-auto pb-4" id="metas-filtros">
      <button data-f="todas"
        class="filter shrink-0 rounded-full bg-white text-black px-4 py-2 text-xs">
        Todas
      </button>
      <button data-f="espiritual"
        class="filter shrink-0 rounded-full bg-zinc-900 px-4 py-2 text-xs">
        Espiritual
      </button>
      <button data-f="saude"
        class="filter shrink-0 rounded-full bg-zinc-900 px-4 py-2 text-xs">
        Saúde
      </button>
      <button data-f="trabalho"
        class="filter shrink-0 rounded-full bg-zinc-900 px-4 py-2 text-xs">
        Trabalho
      </button>
      <button data-f="pessoal"
        class="filter shrink-0 rounded-full bg-zinc-900 px-4 py-2 text-xs">
        Pessoal
      </button>
    </nav>

    <section id="metas-lista" class="space-y-3"></section>

    <p id="metas-vazio"
      class="hidden text-center text-sm text-zinc-500 py-12">
      Nenhuma meta por aqui.
    </p>

    <p id="metas-mensagem"
      class="text-xs text-zinc-500 text-center mt-6"
      role="status"></p>
  </main>
</div>
