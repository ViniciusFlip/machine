
<section class="space-y-6 p-4 md:p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.25em] text-blue-400">Planejamento estratégico</p>
      <h1 class="mt-2 text-3xl font-bold text-white">Metas & Execução</h1>
      <p class="mt-2 text-sm text-zinc-400">Do longo prazo à próxima ação.</p>
    </div>
    <button type="button" onclick="novaMeta()" class="rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-500">
      + Nova meta
    </button>
  </div>

  <div id="resumoMetas" class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <div class="rounded-2xl border border-white/10 bg-[#111] p-4">
      <p class="text-xs text-zinc-400">Metas totais</p>
      <p id="totalMetas" class="mt-2 text-2xl font-bold text-white">—</p>
    </div>
    <div class="rounded-2xl border border-white/10 bg-[#111] p-4">
      <p class="text-xs text-zinc-400">Até 7 dias</p>
      <p id="metas7Dias" class="mt-2 text-2xl font-bold text-blue-400">—</p>
    </div>
    <div class="rounded-2xl border border-white/10 bg-[#111] p-4">
      <p class="text-xs text-zinc-400">Até 3 meses</p>
      <p id="metas3Meses" class="mt-2 text-2xl font-bold text-white">—</p>
    </div>
    <div class="rounded-2xl border border-white/10 bg-[#111] p-4">
      <p class="text-xs text-zinc-400">Concluídas</p>
      <p id="metasConcluidas" class="mt-2 text-2xl font-bold text-green-400">—</p>
    </div>
  </div>

  <div class="flex flex-wrap gap-2" id="filtrosMetas">
    <button type="button" data-filtro="todas" class="rounded-full bg-blue-600 px-4 py-2 text-sm font-medium text-white">Todas</button>
    <button type="button" data-filtro="3dias" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">3 dias</button>
    <button type="button" data-filtro="7dias" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">7 dias</button>
    <button type="button" data-filtro="3meses" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">3 meses</button>
    <button type="button" data-filtro="6meses" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">6 meses</button>
    <button type="button" data-filtro="1ano" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">1 ano</button>
    <button type="button" data-filtro="3anos" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">3 anos</button>
    <button type="button" data-filtro="5anos" class="rounded-full border border-white/10 px-4 py-2 text-sm text-zinc-300">5 anos</button>
  </div>

  <form id="metasForm" class="hidden space-y-5 rounded-2xl border border-white/10 bg-[#111] p-5 md:p-7">
    <input type="hidden" id="metaId">

    <div>
      <label for="tituloMeta" class="mb-2 block text-sm font-medium text-zinc-300">Título da meta</label>
      <input id="tituloMeta" required maxlength="150" placeholder="Ex.: Construir uma renda mensal de R$ 10.000" class="w-full rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500">
    </div>

    <div>
      <label for="prazoMeta" class="mb-2 block text-sm font-medium text-zinc-300">Horizonte da meta</label>
      <select id="prazoMeta" required class="w-full rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500">
        <option value="3dias">Próximos 3 dias</option>
        <option value="7dias">Próximos 7 dias</option>
        <option value="3meses">Próximos 3 meses</option>
        <option value="6meses">Próximos 6 meses</option>
        <option value="1ano">1 ano</option>
        <option value="3anos">3 anos</option>
        <option value="5anos">5 anos (opcional)</option>
      </select>
    </div>

    <div>
      <label for="dataLimiteMeta" class="mb-2 block text-sm font-medium text-zinc-300">Data-alvo (opcional)</label>
      <input id="dataLimiteMeta" type="date" class="w-full rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500">
    </div>

    <div>
      <label for="desfruteMeta" class="mb-2 block text-sm font-medium text-zinc-300">Desfrute — por que isso importa?</label>
      <textarea id="desfruteMeta" rows="3" placeholder="O que essa conquista vai mudar na sua vida?" class="w-full resize-y rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500"></textarea>
    </div>

    <div>
      <label for="acoesMeta" class="mb-2 block text-sm font-medium text-zinc-300">Ações — como vou alcançar?</label>
      <textarea id="acoesMeta" rows="5" required placeholder="Uma ação por linha. Ex.:&#10;Prospectar 10 clientes&#10;Publicar uma oferta&#10;Fazer acompanhamento diário" class="w-full resize-y rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500"></textarea>
    </div>

    <div>
      <label for="statusMeta" class="mb-2 block text-sm font-medium text-zinc-300">Status</label>
      <select id="statusMeta" class="w-full rounded-xl border border-white/10 bg-black px-4 py-3 text-white outline-none focus:border-blue-500">
        <option value="planejada">Planejada</option>
        <option value="em andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
        <option value="pausada">Pausada</option>
      </select>
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-500">Salvar meta</button>
      <button type="button" onclick="cancelarMeta()" class="rounded-xl border border-white/10 px-6 py-3 text-zinc-300 hover:bg-white/5">Cancelar</button>
    </div>
  </form>

  <div id="listaMetas" class="grid gap-4 md:grid-cols-2">
    <p class="text-sm text-zinc-500">Carregando metas...</p>
  </div>
</section>
