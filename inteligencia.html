
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inteligência Profissional</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-white">
<main class="mx-auto max-w-3xl p-5 py-10">
<header class="mb-8">
<p class="text-sm font-bold text-orange-500">PROFESSIONAL INTELLIGENCE</p>
<h1 class="mt-2 text-3xl font-bold">Currículo mestre</h1>
<p class="mt-2 text-neutral-400">Sua fonte central de informações profissionais.</p>
</header>

<div id="status" class="mb-5 rounded-xl border border-neutral-800 bg-neutral-900 p-4">Conectando ao Firebase...</div>

<form id="profileForm" class="space-y-4 rounded-2xl border border-neutral-800 bg-neutral-900 p-5">
<div><label>Nome profissional</label><input name="name" required class="field" placeholder="Nome completo"></div>
<div><label>Título profissional</label><input name="title" required class="field" placeholder="Desenvolvedor em formação"></div>
<div><label>Resumo profissional</label><textarea name="summary" rows="3" class="field"></textarea></div>
<div><label>Competências</label><input name="skills" class="field" placeholder="JavaScript, HTML, Firebase"></div>

<div>
<label>Experiência profissional complementar</label>
<textarea name="experience" rows="3" class="field" placeholder="Informações adicionais, projetos e resultados."></textarea>
</div>

<div>
<div class="mb-3 flex items-center justify-between gap-3">
<label class="font-semibold">Experiências profissionais cadastradas</label>
<button type="button" id="refreshHistory" class="text-sm text-orange-400">Atualizar lista</button>
</div>
<p id="historyCount" class="mb-3 text-xs text-neutral-500"></p>
<div id="historyList" class="space-y-3">
<p class="text-sm text-neutral-400">Carregando experiências...</p>
</div>
</div>

<div><label>Formação</label><textarea name="education" rows="2" class="field"></textarea></div>
<div><label>Cargos desejados</label><input name="targetRoles" class="field"></div>
<div><label>Modalidade</label><select name="workMode" class="field"><option value="remoto">Remoto</option><option value="hibrido">Híbrido</option><option value="presencial">Presencial</option><option value="qualquer">Qualquer modalidade</option></select></div>
<div><label>Localização</label><input name="location" class="field"></div>
<div><label>LinkedIn</label><input name="linkedin" type="url" class="field"></div>
<div><label>Portfólio</label><input name="portfolio" type="url" class="field"></div>
<div><label>GitHub</label><input name="github" type="url" class="field"></div>

<div class="flex flex-wrap gap-3 pt-3">
<button id="saveButton" type="submit" class="action bg-orange-600">Salvar currículo</button>
<button type="button" id="previewButton" class="action bg-white !text-black">Preview</button>
<button type="button" id="reloadButton" class="action bg-neutral-700">Recarregar</button>
</div>
</form>
<p id="profileInfo" class="mt-4 text-sm text-neutral-400"></p>
</main>

<section id="preview" class="fixed inset-0 z-50 hidden overflow-y-auto bg-white text-neutral-900">
<div class="mx-auto max-w-3xl p-6 sm:p-10">
<div class="mb-10 flex justify-between">
<span class="text-xs text-neutral-500">PRÉ-VISUALIZAÇÃO</span>
<button type="button" id="closePreview" class="rounded-lg bg-neutral-900 px-4 py-2 text-white">Voltar</button>
</div>
<article id="resume"></article>
</div>
</section>

<style>
.field{display:block;width:100%;margin-top:6px;background:#171717;border:1px solid #404040;border-radius:10px;padding:11px;color:white;outline:none}
.field:focus{border-color:#ff3008}
label{display:block;font-size:14px;color:#d4d4d4}
.action{flex:1;border-radius:10px;padding:12px 16px;font-weight:bold}
</style>

<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const config= {
  apiKey: "AIzaSyD-xzRjMRVUpey19g745DvPjjpCApqSHVE",
  authDomain: "myops-d7525.firebaseapp.com",
  projectId: "myops-d7525",
  storageBucket: "myops-d7525.firebasestorage.app",
  messagingSenderId: "247824192162",
  appId: "1:247824192162:web:77c91ab1e3df855dc7fdfb"
}


const app=getApps().length?getApp():initializeApp(config);
const auth=getAuth(app),db=getFirestore(app);

const form=document.getElementById("profileForm");
const status=document.getElementById("status");
const historyList=document.getElementById("historyList");
const historyCount=document.getElementById("historyCount");

let user=null,historias=[];

const ref=()=>doc(db,"professionalProfiles",user.uid);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const read=()=>Object.fromEntries(new FormData(form));

const section=(title,value)=>value?`<section class="mb-7"><h2 class="mb-3 border-b pb-2 text-lg font-bold">${title}</h2><div class="whitespace-pre-line leading-7">${value}</div></section>`:"";

function renderHistory(){
 historyCount.textContent=`${historias.length} experiência(s) encontrada(s)`;

 if(!historias.length){
  historyList.innerHTML='<p class="rounded-xl border border-neutral-800 p-4 text-sm text-neutral-400">Nenhuma experiência encontrada na coleção historias deste banco.</p>';
  return;
 }

 historyList.innerHTML=historias.map(j=>`
  <article class="rounded-xl border border-neutral-800 bg-neutral-950 p-4">
   <h3 class="font-bold">${esc(j.cargo||"Cargo não informado")}</h3>
   <p class="mt-1 text-xs text-neutral-400">${esc(j.dataDe||"")}${j.dataDe?" — ":""}${esc(j.cargoAtual?"Atual":j.dataAte||"")}</p>
   ${j.funcoes?`<p class="mt-3 whitespace-pre-line text-sm leading-6 text-neutral-300">${esc(j.funcoes)}</p>`:""}
  </article>`).join("");
}

async function loadHistory(){
 historyList.innerHTML='<p class="text-sm text-neutral-400">Carregando experiências...</p>';
 historyCount.textContent="";

 try{
  // Lê todos os documentos da coleção, sem filtro ou limite.
  const snapshot=await getDocs(collection(db,"historias"));

  historias=snapshot.docs.map(item=>({
   id:item.id,
   ...item.data()
  }));

  historias.sort((a,b)=>
   String(b.dataDe||"").localeCompare(String(a.dataDe||""))
  );

  renderHistory();

  console.info("Histórias encontradas:",historias.length);
 }catch(error){
  console.error("Erro ao carregar histórias:",error);
  historyCount.textContent="";
  historyList.innerHTML=`<p class="text-sm text-red-400">Erro ao carregar: ${esc(error.message)}</p>`;
 }
}

async function load(){
 if(!user)return;

 try{
  const snap=await getDoc(ref());
  const d=snap.exists()?snap.data():{};

  for(const f of form.elements){
   if(f.name){
    f.value=f.name==="skills"
     ?(Array.isArray(d.skills)?d.skills:[]).join(", ")
     :(d[f.name]||"");
   }
  }

  status.textContent=snap.exists()?"Currículo carregado.":"Cadastre seu currículo.";
  document.getElementById("profileInfo").textContent="Perfil sincronizado com Firebase.";

  await loadHistory();
 }catch(e){
  status.textContent=e.message;
 }
}

form.onsubmit=async e=>{
 e.preventDefault();
 if(!user)return;

 const b=document.getElementById("saveButton");
 b.disabled=true;
 b.textContent="Salvando...";

 try{
  const d=read();
  d.skills=d.skills.split(",").map(s=>s.trim()).filter(Boolean);
  d.uid=user.uid;
  d.email=user.email||"";
  d.updatedAt=serverTimestamp();

  await setDoc(ref(),d,{merge:true});
  status.textContent="Currículo salvo com sucesso.";
 }catch(e){
  status.textContent="Erro ao salvar: "+e.message;
 }finally{
  b.disabled=false;
  b.textContent="Salvar currículo";
 }
};

document.getElementById("reloadButton").onclick=load;
document.getElementById("refreshHistory").onclick=loadHistory;

document.getElementById("previewButton").onclick=async()=>{
 const d=read();
 const out=document.getElementById("resume");

 await loadHistory();

 const skills=d.skills.split(",").map(s=>s.trim()).filter(Boolean);

 const links=["linkedin","portfolio","github"].filter(k=>d[k]).map(k=>
  `<a class="underline" href="${esc(d[k])}" target="_blank" rel="noopener">${k==="linkedin"?"LinkedIn":k==="portfolio"?"Portfólio":"GitHub"}</a>`
 ).join(" · ");

 const jobs=historias.map(j=>`
  <div class="mb-5">
   <h3 class="font-bold">${esc(j.cargo||"Cargo não informado")}</h3>
   <p class="text-sm text-neutral-600">${esc(j.dataDe||"")}${j.dataDe?" — ":""}${esc(j.cargoAtual?"Atual":j.dataAte||"")}</p>
   ${j.funcoes?`<p class="mt-2 whitespace-pre-line leading-7">${esc(j.funcoes)}</p>`:""}
  </div>`).join("");

 out.innerHTML=`
  <header class="mb-8 border-b-2 border-neutral-900 pb-6">
   <h1 class="text-3xl font-bold">${esc(d.name)}</h1>
   <p class="mt-2 text-xl">${esc(d.title)}</p>
   <p class="mt-3 text-sm text-neutral-600">${esc(d.location)}</p>
   <div class="mt-3 flex flex-wrap gap-3 text-sm">${links}</div>
  </header>
  ${section("Resumo profissional",esc(d.summary))}
  ${section("Competências",skills.map(esc).join(" · "))}
  ${section("Experiências profissionais",jobs||"Nenhuma experiência cadastrada.")}
  ${section("Experiência complementar",esc(d.experience))}
  ${section("Formação",esc(d.education))}
  ${section("Objetivo profissional",esc(d.targetRoles))}
  ${section("Modalidade",esc(d.workMode))}
 `;

 document.getElementById("preview").classList.remove("hidden");
};

document.getElementById("closePreview").onclick=()=>document.getElementById("preview").classList.add("hidden");

onAuthStateChanged(auth,async u=>{
 user=u;

 if(!u){
  form.classList.add("hidden");
  status.textContent="Faça login para continuar.";
  return;
 }

 form.classList.remove("hidden");
 await load();
});
</script>
</body>
</html>
