   
<style>
  .minimal .user-content-box,
  .minimal #logo {
    display: none;
  }
</style>

<!-- Header -->
<div id="headerContainer" class="absolute"></div>

 


<!-- CONTEÚDO DO HEADER -->

<div class="flex h-20 items-center justify-between px-4 md:px-6">


  <!-- Menu mobile -->

  <button
    data-auth="logged"
    onclick="toggleSidebar()"
    class="hidden h-10 w-10 items-center justify-center rounded-xl border border-line bg-surface text-soft transition hover:border-white/20 hover:text-white xl:hidden"
  >

    <i
      data-lucide="menu"
      class="h-5 w-5"
    ></i>

  </button>


  <!-- Logo -->

  <div
    id="logo"
    class="flex items-center justify-center xl:justify-start"
  >

    <a href="./">

      <img
        class="h-10 md:h-11"
        src="assets/images/ft-logo.png"
        alt="Logo"
      >

    </a>

  </div>


  <!-- Menu Desktop -->

  <nav
    id="horizontal-nav"
    data-auth="logged"
    class="hidden items-center gap-8 text-xs text-white/45"
  >

    <button
      onclick="toggleSidebar()"
      class="text-white/45 transition hover:text-white"
    >

      <i
        id="sidebarToggleIcon"
        data-lucide="menu"
        class="h-4 w-4"
      ></i>

    </button>


    <a
      href="./hub"
      class="text-white"
    >
      OMDA Tracker
    </a>


   


   

<a
  href="#"
  data-page="home"
  class="transition hover:text-white"
>
  Home
</a>
    
<a
  href="#"
  data-page="fansubs"
  class="hidden transition hover:text-white"
>
  Fansubs
</a>
    


<a
  href="#"
  data-page="mangas"
  class="hidden transition hover:text-white"
>
  Mangas
</a>

<a
  href="#"
  data-page="torrents"
  class="hidden transition hover:text-white"
>
  Torrents
</a>

   <a
  href="#"
  data-page="doacoes"
  class="transition hover:text-white"
>
  Doações
</a> 
  </nav>


 


  

  <!-- Botões -->

  <div
    data-auth="logged"
    class="hidden items-center justify-center gap-2 ml-6 mr-6"
  >


    <!-- Busca -->

    <button
      class="hidden flex h-10 w-10 items-center justify-center rounded-xl border border-line bg-surface text-soft transition hover:border-white/20 hover:bg-white/5 hover:text-white"
    >

      <i
        data-lucide="search"
        class="h-5 w-5"
      ></i>

    </button>


    <!-- Fullscreen -->

    <button
      id="fullscreenToggle"
      class="fullscreen-btn hidden"
    >

      <i
        id="iconMaximize"
        data-lucide="maximize-2"
      ></i>

      <i
        id="iconMinimize"
        data-lucide="minimize-2"
        style="display:none;"
      ></i>

    </button>


    <!-- Notificações -->

    <div class="relative hidden">

      <button
        id="notificatixonBtn"
        class="relative flex h-10 w-10 items-center justify-center rounded-xl text-soft transition hover:bg-surface hover:text-white"
      >

        <i
          data-lucide="bell"
          class="h-5 w-5"
        ></i>


        <span
          id="notificationCount"
          class="hidden absolute -top-1 -right-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-semibold text-white"
        >
          0
        </span>

      </button>


      <!-- Dropdown -->

      <div
        id="notificationDropdown"
        class="hidden absolute right-0 z-50 mt-3 max-h-[calc(100vh-100px)] w-80 overflow-y-auto rounded-2xl border border-line bg-surface p-4 shadow-2xl xl:p-5"
      >

        <h3 class="mb-4 font-semibold text-white">
          Notificações
        </h3>

        <div
          id="notificationList"
          class="space-y-3"
        ></div>

      </div>

    </div>

  </div>


  <!-- Usuário -->

  <div
    id="userMenuBtn"
    data-auth="logged"
    class="hidden items-center gap-3 rounded-xl px-2 py-2 cursor-pointer transition-all duration-200 hover:bg-surface active:scale-95"
  >

    <img
      data-user-photo
      src="assets/images/user-avatar.png"
      class="h-9 w-9 rounded-full border border-line object-cover"
      alt="Usuário"
    >


    <i
      data-lucide="chevrons-right"
      class="h-4 w-4 text-soft transition-transform duration-200"
    ></i>

  </div>


  <!-- NÃO LOGADO -->
<a
  href="./auth/"
  class="group relative inline-flex h-[42px] items-center no-underline"
>
  <span
    class="absolute inset-0 rounded-[11px] bg-[#0b2cff] -skew-x-[14deg]"
  ></span>

  <span class="relative z-10 flex h-full items-center gap-3 px-3">
    <span class="text-[14px] font-light leading-none text-white">
      Entrar
    </span>

    <span
      class="flex h-[28px] w-[28px] shrink-0 items-center justify-center
             rounded-[7px] bg-black"
    >
      <i data-lucide="arrow-up-right" class="h-4 w-4 stroke-[2]"></i>
    </span>
  </span>
</a>
</div>


<!-- Busca mobile -->

<div class="hidden mt-3 pt-0">

  <input
    class="input"
    placeholder="Buscar torrents..."
  >

</div>
